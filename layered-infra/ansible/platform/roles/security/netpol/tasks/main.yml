- name: "NetworkPolicy cho namespace demo (app: chỉ nhận từ Gateway)"
  kubernetes.core.k8s:
    template: demo-netpol.yaml.j2

# Dựng từ đầu: kube-bench, monitoring, velero do role chạy SAU tạo (60 kube_bench, 70 metrics, 80 backup) → tạo trước
# namespace trống để policy có chỗ nằm, pod sinh ra là đã bị chặn đúng ngay từ đầu. Role sau chỉ gộp thêm nhãn (k8s apply = merge).
- name: Namespace có sẵn trước khi đặt policy
  kubernetes.core.k8s:
    kind: Namespace
    name: "{{ item.key }}"
    state: present
  loop: "{{ netpol_namespaces | dict2items }}"
  loop_control: { label: "{{ item.key }}" }
  when: not netpol_only or item.key in netpol_only

# Áp bằng merge: khoá cấp trên đã có không bị xoá → đổi deny_all ↔ mở sẽ sót ingressDeny/egressDeny cũ (deny thắng allow).
# CRD không cho replace thiếu resourceVersion → khi chế độ đổi thì xoá policy cũ trước rồi tạo lại.
- name: Policy "baseline" đang có
  kubernetes.core.k8s_info:
    api_version: cilium.io/v2
    kind: CiliumNetworkPolicy
    field_selectors: [metadata.name=baseline]
  register: netpol_existing

- name: Xoá "baseline" cũ khác chế độ (deny_all ↔ mở)
  kubernetes.core.k8s:
    state: absent
    api_version: cilium.io/v2
    kind: CiliumNetworkPolicy
    namespace: "{{ item.metadata.namespace }}"
    name: baseline
  loop: "{{ netpol_existing.resources }}"
  loop_control: { label: "{{ item.metadata.namespace }}" }
  when:
    - item.metadata.namespace in netpol_namespaces
    - ('ingressDeny' in item.spec) != (netpol_namespaces[item.metadata.namespace].deny_all | default(false))

- name: Mặc định chặn cho các namespace còn lại (CiliumNetworkPolicy "baseline")
  kubernetes.core.k8s:
    template: baseline-netpol.yaml.j2
  vars: { netpol_ns: "{{ item.key }}", netpol_cfg: "{{ item.value }}" }   # tên riêng: biến register "cfg" của role khác được ưu tiên hơn biến task
  loop: "{{ netpol_namespaces | dict2items }}"
  loop_control: { label: "{{ item.key }}" }
  when: not netpol_only or item.key in netpol_only
