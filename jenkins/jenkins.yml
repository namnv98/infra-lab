# Cài Jenkins: standalone hoặc controller + agent, tùy group [jenkins_agents] trong inventory.
# Nguồn cài: jenkins_install_source = online | offline (group_vars/all/settings.yml).
#
# Luồng 4 play (vì sao controller chạy 2 lần: JCasC cần thông tin của agent):
#   1. Prepare     — mọi host: chờ SSH, facts, cloud-init, kiểm tra điều kiện
#   2. Controller  — role jenkins (main.yml): Java, Jenkins, plugin, SSH key
#   3. Agents      — role jenkins_agent: Java, user jenkins, nhận public key của controller
#   4. Controller  — role jenkins (casc.yml): known_hosts, JCasC, restart/reload, kiểm tra agent online
#
# Fact truyền giữa các play (đọc qua hostvars):
#   controller → agent : jenkins_controller_pubkey   (play 2 → play 3)
#   agent → controller : jenkins_agent_hostkey       (play 3 → play 4)
#                        jenkins_java_bin            (đường dẫn java trên agent, cho JCasC)
#   controller nội bộ  : jenkins_restart_needed      (play 2 → play 4)
- name: Prepare all hosts
  hosts: jenkins_all
  become: true
  gather_facts: false
  tasks:
    # VM vừa tạo có thể mở port 22 trước khi nhận SSH key → chờ login được thật
    - name: Wait until SSH login works
      ansible.builtin.wait_for_connection:
        timeout: 300
    - name: Gather facts
      ansible.builtin.setup:
    - name: Wait for cloud-init / package manager lock
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false
    - name: Online mode needs Debian/Ubuntu (apt)
      ansible.builtin.assert:
        that: ansible_facts.os_family == 'Debian'
        fail_msg: "Chế độ online chỉ hỗ trợ Debian/Ubuntu (host này: {{ ansible_facts.distribution }}). Distro khác → jenkins_install_source=offline"
        quiet: true
      when: jenkins_install_source == 'online'
    - name: systemd is required
      ansible.builtin.assert:
        that: ansible_facts.service_mgr == 'systemd'
        quiet: true
    - name: Offline mode needs a matching bundle
      ansible.builtin.assert:
        that:
          - (jenkins_bundle_dir ~ '/manifest.json') is file
          - jenkins_bundle.jenkins_version == jenkins_version
          - jenkins_bundle.plugins_requested == (jenkins_plugins | sort)
        fail_msg: "bundle/ chưa có hoặc không khớp jenkins_version / jenkins_plugins — chạy lại `ansible-playbook bundle.yml` trên máy có internet"
        quiet: true
      run_once: true
      when: jenkins_install_source == 'offline'
    - name: Exactly one controller
      ansible.builtin.assert:
        that: groups['jenkins_controller'] | length == 1
        fail_msg: "[jenkins_controller] phải có đúng 1 host"
        quiet: true
      run_once: true

- name: Install Jenkins controller          # play 2
  hosts: jenkins_controller
  become: true
  gather_facts: false
  roles:
    - jenkins

- name: Set up Jenkins agents               # play 3
  hosts: jenkins_agents
  become: true
  gather_facts: false
  roles:
    - jenkins_agent

- name: Configure controller (JCasC — users, agents)   # play 4
  hosts: jenkins_controller
  become: true
  gather_facts: false
  tasks:
    - name: Apply configuration as code
      ansible.builtin.include_role:
        name: jenkins
        tasks_from: casc
