# Toàn bộ biến của bộ cài. Phần trên: người dùng chỉnh. Phần cuối: đường dẫn / biến suy ra, thường không sửa.

# --- Nguồn cài ---
#   online : VM tự tải từ internet (apt, pkg.jenkins.io, update center). Chỉ Debian/Ubuntu.
#   offline: VM không cần internet. Chạy `ansible-playbook bundle.yml` trên máy có internet để tải
#            mọi thứ vào bundle/, mang thư mục đó sang máy chạy Ansible, rồi ./install.sh đẩy file
#            lên VM qua SSH. Chạy được trên mọi distro Linux dùng systemd.
jenkins_install_source: online
jenkins_bundle_dir: "{{ playbook_dir }}/bundle"
jenkins_bundle_arches: [x64]          # x64 | aarch64 — kiến trúc CPU của các VM

# --- Java (controller và agent phải cùng major) ---
jenkins_java_major: 21
jenkins_java_package: openjdk-21-jre-headless          # online (Debian 12 không có → dùng offline)
jenkins_offline_java_home: /opt/java/jre-{{ jenkins_java_major }}   # offline

# --- Jenkins ---
jenkins_version: 2.580.2              # offline: version jenkins.war đóng vào bundle (online: bản LTS mới nhất từ apt)
jenkins_http_port: 8080
jenkins_url: "http://{{ hostvars[groups['jenkins_controller'][0]].ansible_host | default(groups['jenkins_controller'][0]) }}:{{ jenkins_http_port }}/"
jenkins_admin_user: admin
# Tự sinh lần đầu, lưu ở credentials/ (đã gitignore). Muốn tự đặt: ghi đè (nên dùng ansible-vault).
jenkins_admin_password: "{{ lookup('ansible.builtin.password', playbook_dir ~ '/credentials/jenkins_admin_password', length=24, chars=['ascii_letters', 'digits']) }}"
jenkins_casc_reload_token: "{{ lookup('ansible.builtin.password', playbook_dir ~ '/credentials/jenkins_casc_reload_token', length=32, chars=['ascii_letters', 'digits']) }}"
jenkins_controller_executors: 2       # chỉ dùng ở chế độ standalone; có agent thì = 0
# Nâng Jenkins + mọi plugin lên bản mới nhất (online). Mặc định chỉ cài cái còn thiếu, không đụng bản đang chạy.
# Dùng 1 lần: ./install.sh -e jenkins_upgrade=true   (offline: đổi jenkins_version, chạy lại bundle.yml)
jenkins_upgrade: false

jenkins_plugin_manager_version: 2.16.0
jenkins_plugins:
  - configuration-as-code
  - ssh-slaves
  - git
  - workflow-aggregator
  - pipeline-graph-view
  - timestamper

# --- Agent (ghi đè được theo từng host trong inventory) ---
jenkins_agent_executors: 2
jenkins_agent_labels: linux
jenkins_agent_home: /home/jenkins
# Địa chỉ controller dùng để SSH vào agent. Mặc định IP nội bộ của agent (cùng VPC/LAN);
# controller và agent khác mạng → đặt jenkins_agent_address=<IP public> cho host đó.
jenkins_agent_address: "{{ ansible_facts.default_ipv4.address | default(ansible_host) }}"

# ===================== Đường dẫn / biến suy ra — thường không sửa =====================
jenkins_home: /var/lib/jenkins
jenkins_war: /usr/share/java/jenkins.war
jenkins_casc_dir: /etc/jenkins/casc
jenkins_secrets_dir: /etc/jenkins/secrets
jenkins_repo_url: https://pkg.jenkins.io/debian-stable
jenkins_key_url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
jenkins_plugin_manager_url: "https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/{{ jenkins_plugin_manager_version }}/jenkins-plugin-manager-{{ jenkins_plugin_manager_version }}.jar"
# File đánh dấu "cần restart Jenkins": play 2 tạo (handler), configure.yml restart xong thì xóa.
# Nằm trên đĩa nên lần chạy trước lỗi giữa chừng thì lần sau vẫn restart.
jenkins_restart_marker: "{{ jenkins_home }}/.ansible-restart-pending"
jenkins_java_bin: "{{ '/usr/bin/java' if jenkins_install_source == 'online' else jenkins_offline_java_home ~ '/bin/java' }}"

# Nội dung bundle/manifest.json (do bundle.yml sinh). Chỉ dùng ở chế độ offline; chưa có bundle → {}.
jenkins_bundle: "{{ lookup('ansible.builtin.file', jenkins_bundle_dir ~ '/manifest.json', errors='ignore') | default('{}', true) | from_json }}"
