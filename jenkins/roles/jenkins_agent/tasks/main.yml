# Agent (play 3): Java + git, user jenkins, nhận public key của controller.
# Controller SSH vào bằng user jenkins (IP + host key agent do configure.yml tự đọc ở play 4).
- name: Java, git
  ansible.builtin.include_role:
    name: jenkins_common

- name: User jenkins
  ansible.builtin.user:
    name: jenkins
    home: "{{ jenkins_agent_home }}"
    shell: /bin/bash

- name: Agent work dir
  ansible.builtin.file:
    path: "{{ jenkins_agent_home }}/agent"
    state: directory
    owner: jenkins
    group: jenkins
    mode: "0755"

- name: Authorize controller key
  ansible.posix.authorized_key:
    user: jenkins
    key: "{{ hostvars[groups['jenkins_controller'][0]].jenkins_controller_pubkey }}"
    exclusive: true
