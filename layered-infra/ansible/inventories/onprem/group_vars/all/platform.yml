# Đặc thù nền tảng ON-PREM (GCP: inventories/gcp/group_vars/all/platform.yml)
node_interface: enp1s0                 # card mạng chính của VM trên KVM/Proxmox (GCP: ens4)

# ⚠ Các biến dưới đây CHƯA được role dùng — chỗ cần làm thêm để chạy on-prem (xem inventories/onprem/README.md)
node_network_mode: static              # GCP: DHCP của VPC + chỉ đổi DNS · on-prem: IP tĩnh + gateway = firewall của VLAN
ntp_client: systemd-timesyncd          # GCP: chrony (image của Google) · Ubuntu thường: timesyncd
firewall_bootstrap: usb                # GCP: serial console + metadata · on-prem: USB chứa /conf/config.xml (00-firewall-bootstrap.yml)

# IP public của firewall biên = card WAN trong plan (GCP: đọc từ tofu)
fw_public_ip: "{{ (plan.firewalls['firewall-edge-01'].nics | selectattr('zone', 'equalto', 'wan') | first).ip }}"
