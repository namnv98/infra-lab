[defaults]
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
interpreter_python = auto_silent
remote_user = ubuntu
# Playbook nằm trong playbooks/, không phải ở gốc ansible/, nên Ansible mặc
# định tìm role ở "playbooks/roles" (sai) — chỉ rõ lại "roles" (= ansible/roles).
roles_path = roles
# become_user trong role devstack là "stack" (không phải root) — Ansible mặc
# định thử cấp quyền file tạm cho user không phải root bằng chmod kiểu ACL
# (cú pháp BSD/macOS: "A+user:...:allow"), GNU chmod trên Ubuntu không hiểu,
# lỗi "invalid mode". Bật cờ này để Ansible dùng chmod thường (world-readable)
# thay cho ACL — an toàn trong phạm vi lab này (VM chỉ có 2 user liên quan).
allow_world_readable_tmpfiles = True

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=accept-new
