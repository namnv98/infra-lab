- name: Namespace kube-bench (Job cần hostPID và mount thư mục host → privileged)
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: kube-bench
        labels: { pod-security.kubernetes.io/enforce: privileged }

- name: Tải manifest Job của kube-bench {{ kube_bench_version }}
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/aquasecurity/kube-bench/{{ kube_bench_version }}/job-{{ item }}.yaml"
    dest: "/root/kube-bench-{{ item }}.yaml"
    mode: "0644"
  loop: [master, node]

- name: Cố định image đúng phiên bản (manifest gốc dùng :latest)
  ansible.builtin.replace:
    path: "/root/kube-bench-{{ item }}.yaml"
    regexp: 'aquasec/kube-bench:latest'
    replace: 'aquasec/kube-bench:{{ kube_bench_version }}'
  loop: [master, node]

- name: Xoá Job cũ (Job không chạy lại được)
  kubernetes.core.k8s:
    state: absent
    kind: Job
    namespace: kube-bench
    name: "kube-bench-{{ item }}"
    wait: true
    delete_options: { propagationPolicy: Foreground }   # xoá cả pod của Job (mặc định của Job qua API: bỏ pod mồ côi)
  loop: [master, node]

- name: Chạy kube-bench (master trên control-plane, node trên worker)
  kubernetes.core.k8s:
    src: "/root/kube-bench-{{ item }}.yaml"
    namespace: kube-bench
  loop: [master, node]

- name: Chờ chấm xong
  kubernetes.core.k8s_info:
    kind: Job
    namespace: kube-bench
    name: "kube-bench-{{ item }}"
    wait: true
    wait_condition: { type: Complete, status: "True" }
    wait_timeout: 600         # lần đầu phải kéo image từ Docker Hub
  loop: [master, node]

- name: Lấy kết quả
  ansible.builtin.command: kubectl -n kube-bench logs job/kube-bench-{{ item }}
  loop: [master, node]
  register: bench
  changed_when: false

- name: Lưu báo cáo về host
  ansible.builtin.copy:
    content: "{{ item.stdout }}"
    dest: "{{ lab_out }}/kube-bench-{{ item.item }}.txt"
    mode: "0644"
  loop: "{{ bench.results }}"
  loop_control: { label: "{{ item.item }}" }
  delegate_to: localhost
  become: false

- name: Tóm tắt
  ansible.builtin.debug:
    msg: "{{ item.item }}: {{ item.stdout_lines | select('search', 'checks (PASS|FAIL|WARN|INFO)') | list }}"
  loop: "{{ bench.results }}"
  loop_control: { label: "{{ item.item }}" }

- name: FAIL ngoài danh sách ngoại lệ đã chấp nhận (kube_bench_accepted) — phải xử lý
  ansible.builtin.debug:
    msg: "{{ bench.results | map(attribute='stdout_lines') | flatten | select('match', '^\\[FAIL\\]')
             | reject('search', '^\\[FAIL\\] (' ~ (kube_bench_accepted.keys() | map('regex_escape') | join('|')) ~ ') ') | list }}"
