[defaults]
# inventory = thư mục shared/inventory/: hosts.yml (viết tay) + provisioned.yml (IP public, nếu bộ tạo máy ghi)
inventory = shared/inventory
# Không đặt roles_path: mỗi team chỉ thấy role trong <team>/roles/ cạnh playbook của mình — không gọi được role của team khác
host_key_checking = False
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
forks = 10
# Mọi SSH đi xuyên qua jump-01 (e2-micro): khi jump đang bận (vd. tự cài gói) bắt tay chậm → nới timeout
timeout = 30
log_path = ../out/logs/ansible.log

[ssh_connection]
# known_hosts riêng của lab (out/known_hosts): đặt trong shared/inventory/group_vars/all/paths.yml
# ServerAlive: kết nối chết lặng (đi qua jump + 2 firewall) bị phát hiện sau ~60s → retries thay vì treo vô hạn
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=4
pipelining = True
retries = 3
