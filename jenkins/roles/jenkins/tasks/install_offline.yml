# Offline: jenkins.war + systemd unit tự viết, từ bundle/ (mọi distro dùng systemd)
- name: Group jenkins
  ansible.builtin.group:
    name: jenkins
    system: true

- name: User jenkins
  ansible.builtin.user:
    name: jenkins
    group: jenkins
    system: true
    home: "{{ jenkins_home }}"
    shell: /bin/bash

- name: Dirs
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0755"
  loop:
    - { path: "{{ jenkins_war | dirname }}", owner: root }
    - { path: "{{ jenkins_home }}", owner: jenkins }
    - { path: /var/cache/jenkins, owner: jenkins }

- name: jenkins.war
  ansible.builtin.copy:
    src: "{{ jenkins_bundle_dir }}/{{ jenkins_bundle.war }}"
    dest: "{{ jenkins_war }}"
    mode: "0644"
  register: war_copy

- name: Systemd unit
  ansible.builtin.template:
    src: jenkins.service.j2
    dest: /etc/systemd/system/jenkins.service
    mode: "0644"
  register: unit_file
