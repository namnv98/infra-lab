# App (whoami) + cert vùng biên + HAProxy/WAF trên edge-01. Sau 40 vì image kéo qua Harbor.
- name: App demo + cert cho vùng biên
  hosts: "{{ groups['k8s_control_plane'][0] }}"
  become: true
  environment: "{{ egress_env | combine({'K8S_AUTH_KUBECONFIG': '/etc/kubernetes/admin.conf', 'KUBECONFIG': '/etc/kubernetes/admin.conf'}) }}"
  roles:
    - apps/whoami        # app whoami để kiểm tra
  tasks:
    - name: Gỡ WAF cũ trong cluster (đã chuyển ra vùng biên trên edge-01)
      kubernetes.core.k8s:
        state: absent
        api_version: "{{ item.v }}"
        kind: "{{ item.k }}"
        namespace: demo
        name: waf
      loop:
        - { v: apps/v1, k: Deployment }
        - { v: v1, k: Service }
        - { v: cilium.io/v2, k: CiliumNetworkPolicy }
      loop_control: { label: "{{ item.k }}/waf" }

    - name: Cert vùng biên *.{{ gateways.public.domain }} (ký bởi lab-ca, key riêng, không dùng chung với Gateway)
      kubernetes.core.k8s:
        wait: true
        wait_condition: { type: Ready, status: "True" }
        definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata: { name: edge-tls, namespace: cert-manager }
          spec:
            secretName: edge-tls
            dnsNames: ["*.{{ gateways.public.domain }}", "{{ gateways.public.domain }}"]
            duration: 8760h
            issuerRef: { name: lab-ca, kind: ClusterIssuer }

    - name: Đọc cert vùng biên
      kubernetes.core.k8s_info: { kind: Secret, namespace: cert-manager, name: edge-tls }
      register: edge_secret
      no_log: true

    - name: Giữ cert để play vùng biên dùng
      ansible.builtin.set_fact:
        edge_tls:
          crt: "{{ edge_secret.resources[0].data['tls.crt'] | b64decode }}"
          key: "{{ edge_secret.resources[0].data['tls.key'] | b64decode }}"
      no_log: true

- name: Vùng biên trong DMZ — HAProxy (LB, TLS) + WAF (OWASP CRS)
  hosts: edge
  become: true
  vars:
    edge_tls: "{{ hostvars[groups['k8s_control_plane'][0]].edge_tls }}"
  roles: [network/edge_lb_waf]
