# Tạo bundle cho chế độ offline. Chạy trên máy CÓ internet:  ansible-playbook bundle.yml
- name: Build Nexus offline bundle
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Bundle dir
      ansible.builtin.file:
        path: "{{ nexus_bundle_dir }}"
        state: directory
        mode: "0755"

    - name: Download Nexus tarball (kèm JDK)
      ansible.builtin.get_url:
        url: "{{ nexus_download_url }}"
        dest: "{{ nexus_bundle_dir }}/{{ nexus_tarball }}"
        checksum: "sha256:{{ nexus_download_url }}.sha256"
        mode: "0644"
        timeout: 600
