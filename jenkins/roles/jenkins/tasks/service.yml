# Cấu hình service qua drop-in (dùng cho cả unit của package lẫn unit offline)
- name: Systemd drop-in dir
  ansible.builtin.file:
    path: /etc/systemd/system/jenkins.service.d
    state: directory
    mode: "0755"

- name: Systemd drop-in (port, JCasC, bỏ setup wizard)
  ansible.builtin.copy:
    dest: /etc/systemd/system/jenkins.service.d/override.conf
    mode: "0600"
    content: |
      [Service]
      Environment="JENKINS_PORT={{ jenkins_http_port }}"
      Environment="CASC_JENKINS_CONFIG={{ jenkins_casc_dir }}"
      Environment="CASC_RELOAD_TOKEN={{ jenkins_casc_reload_token }}"
      Environment="JAVA_OPTS=-Djava.awt.headless=true -Djenkins.install.runSetupWizard=false{{ ' -Dhudson.model.UpdateCenter.never=true' if jenkins_install_source == 'offline' else '' }}"
  register: dropin
  no_log: true
