- name: Kiểm tra cluster đã khởi tạo chưa
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf

- name: Đặt kube-vip trước khi init (kubeadm cần VIP sống để kiểm tra API server)
  ansible.builtin.include_role:
    name: k8s/kube_vip
  vars: { kube_vip_kubeconfig: super-admin.conf }
  when: not admin_conf.stat.exists

- name: kubeadm init, endpoint là VIP (cert của API server sẽ có cả IP {{ api_vip }})
  ansible.builtin.command: >
    kubeadm init
    --kubernetes-version v{{ k8s_version }}
    --node-name {{ inventory_hostname }}
    --control-plane-endpoint {{ api_vip }}:6443
    --apiserver-advertise-address {{ ansible_host }}
    --upload-certs
    --pod-network-cidr {{ pod_cidr }}
    --service-cidr {{ service_cidr }}
    --skip-phases addon/kube-proxy
  args:
    creates: /etc/kubernetes/admin.conf
  register: kubeadm_init

- name: Lưu output kubeadm init để xem lại
  ansible.builtin.copy:
    content: "{{ kubeadm_init.stdout }}"
    dest: /root/kubeadm-init.log
    mode: "0600"
  when: kubeadm_init is changed

- name: Init xong, chuyển kube-vip về admin.conf
  ansible.builtin.include_role:
    name: k8s/kube_vip

- name: Kéo kubeconfig về host (server = VIP)
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubeconfig_local }}"
    flat: true

- name: Tạo lệnh join (token hết hạn sau 24h)
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_cmd
  changed_when: false

- name: Upload lại cert của control plane, lấy certificate key (hết hạn sau 2h)
  ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
  register: upload_certs
  changed_when: false

- name: Lưu thông tin join cho các node khác
  ansible.builtin.set_fact:
    join_command: "{{ join_cmd.stdout }}"
    certificate_key: "{{ upload_certs.stdout_lines[-1] }}"
