# INVENTORY của lab — máy, nhóm và quy hoạch mạng. NGUỒN DUY NHẤT của mọi IP, sửa tay ở đây.
# GCP và máy nhà (provision/libvirt) dùng CHUNG file này: cùng vùng, cùng IP, cùng luật firewall. Khác nhau chỉ IP public
# + vài biến của nơi chạy, do bộ tạo máy ghi vào provisioned.yml cạnh file này (gộp đè lên vars dưới đây, không commit).
# Topology khác hẳn (on-prem có transit riêng…) = sửa IP/card/vùng ở đây + luật firewall: ví dụ docs/examples/onprem/.
# Ai đọc file này:
#   Ansible (mọi team)               inventory: máy + nhóm + biến dưới đây
#   provision/gcp/main.tf            yamldecode: VPC, VM, card firewall, alias IP, route (bộ tạo máy, tuỳ chọn)
#   scripts/inventory.py             lab.sh, smoke.sh, harbor-prewarm.sh, gcp.sh, sinh config bootstrap OPNsense
# Sửa xong: make lint (kiểm tra IP trong dải, không trùng, không dùng IP GCP giữ, số card ≤ vCPU).
# GCP giữ .0 .1 .254 .255 của mỗi subnet: gateway VPC luôn là .1, không đặt máy vào .1/.254.
# IP public của biên: provision/gcp ghi IP GCP cấp, provision/libvirt chép provision/libvirt/provisioned.yml (không ghi ở đây).
all:
  vars:
    # Nơi chạy — chỉ script sinh config bootstrap OPNsense + kiểm tra IP cần biết (Ansible không dùng):
    #   gcp: VPC (.1 là gateway của GCP, firewall .253, không ARP giữa VM)
    #   onprem: không có router .1 → máy dùng thẳng card firewall của vùng (fw) làm gateway + route extra_routes, ARP thật
    lab_hosting: gcp
    lab_domain: lab.internal
    lab_mtu: 1460             # MTU mạng (VPC của GCP: 1460) — card OPNsense, VM, WireGuard (= mtu − 80) đều theo số này

    # VM Linux: card mạng chính, cách lấy IP (dhcp: VPC cấp đúng IP · static: Ansible ghi netplan), dịch vụ NTP của image
    node_interface: ens4
    node_network_mode: dhcp
    ntp_client: chrony

    # Vùng = VPC (máy nhà: 1 mạng libvirt). gateway = gateway của VPC (.1); fw = card firewall làm "default gateway" của vùng
    # (GCP: route VPC 0/0 · onprem: máy trỏ thẳng vào fw). vlan = VLAN ID trên switch on-prem (máy nhà: Open vSwitch), GCP bỏ qua
    zones:
      wan:  { cidr: 10.99.0.0/24,  gateway: 10.99.0.1 }
      dmz:  { cidr: 10.10.10.0/24, gateway: 10.10.10.1, fw: 10.10.10.253, vlan: 10 }   # biên
      lan:  { cidr: 10.20.0.0/24,  gateway: 10.20.0.1,  fw: 10.20.0.253, vlan: 20 }    # core
      mgmt: { cidr: 10.40.0.0/24,  gateway: 10.40.0.1,  fw: 10.40.0.253, vlan: 40 }    # core

    # Route ngoài 0/0 của từng vùng: vào vùng khác qua firewall khác (DMZ → LAN/MGMT đi qua core)
    # GCP: route của VPC · onprem: route tĩnh trên máy trong vùng (netplan) + trên firewall biên
    extra_routes:
      - { name: dmz-to-lan-core, in: dmz, to: lan,  via: firewall-core-01 }
      - { name: dmz-to-mgmt,     in: dmz, to: mgmt, via: firewall-core-01 }

    # VPN quản trị (WireGuard trên firewall biên)
    vpn: { cidr: 10.50.0.0/24, server: 10.50.0.1, admin: 10.50.0.2, port: 51820 }

    # Kubernetes: VIP API (kube-vip) + 2 Gateway + dải MetalLB. GCP định tuyến các IP này bằng alias IP trên VM (gcp_alias)
    api_vip: 10.20.0.10
    gateways:
      public:   { ip: 10.20.0.200, domain: apps.lab.internal }
      internal: { ip: 10.20.0.210, domain: int.lab.internal }
    metallb_pools:
      public:   10.20.0.200-10.20.0.209
      internal: 10.20.0.210-10.20.0.250

  children:
    # 2 firewall OPNsense (Ansible gọi API từ máy admin, không SSH). nics theo thứ tự = vtnet0..n; if = tên card trong OPNsense;
    # số card ≤ số vCPU (GCP). Cỡ máy: machine_type (GCP) · vcpus + ram_mb (libvirt); disk_gb chung (firewall mặc định 10)
    firewalls:
      hosts:
        firewall-edge-01:
          fw_role: edge
          machine_type: e2-medium
          vcpus: 2
          ram_mb: 1536
          fw_dns: 1.1.1.1                    # biên tự phân giải tên công cộng
          nics:
            - { zone: dmz, ip: 10.10.10.253, if: lan, descr: DMZ }
            - { zone: wan, ip: 10.99.0.2,    if: wan, default_gw: true }   # gắn IP public
        firewall-core-01:
          fw_role: core
          machine_type: e2-highcpu-4
          vcpus: 2
          ram_mb: 1536
          fw_dns: 10.10.10.253               # core hỏi DNS công cộng qua biên
          nics:
            - { zone: lan,  ip: 10.20.0.253,  if: lan }
            - { zone: dmz,  ip: 10.10.10.252, if: wan, descr: DMZ, default_gw: true }   # card ngoài, đi Internet qua biên
            - { zone: mgmt, ip: 10.40.0.253,  if: opt1, descr: MGMT }

    # VM Linux, nhóm theo vai trò. zone = vùng của máy; gcp_alias = IP phụ GCP định tuyến tới VM (tên trong biến ở trên)
    linux:
      children:
        k8s:
          children:
            k8s_control_plane:
              hosts:
                k8s-master-01: { ansible_host: 10.20.0.11, zone: lan, machine_type: e2-medium, vcpus: 2, ram_mb: 3072, disk_gb: 30, gcp_alias: [api_vip] }
            k8s_workers:
              hosts:
                k8s-worker-01: { ansible_host: 10.20.0.21, zone: lan, machine_type: e2-medium, vcpus: 4, ram_mb: 5120, disk_gb: 30, gcp_alias: [gateway_public, gateway_internal] }
        infra:
          hosts:
            infra-01: { ansible_host: 10.20.0.30, zone: lan, machine_type: e2-medium, vcpus: 2, ram_mb: 4096, disk_gb: 50 }
        edge:
          hosts:
            edge-01: { ansible_host: 10.10.10.10, zone: dmz, machine_type: e2-small, vcpus: 1, ram_mb: 1536, disk_gb: 10 }
        siem:
          hosts:
            siem-01: { ansible_host: 10.40.0.10, zone: mgmt, machine_type: e2-medium, vcpus: 2, ram_mb: 4096, disk_gb: 30 }
        bastion:
          hosts:
            jump-01: { ansible_host: 10.40.0.20, zone: mgmt, machine_type: e2-micro, vcpus: 1, ram_mb: 1024, disk_gb: 10 }
