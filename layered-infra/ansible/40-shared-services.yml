# Dịch vụ dùng chung trên infra-01: Harbor (cache image) + Squid (proxy có allowlist) + kho S3 Garage;
#   node trỏ containerd vào Harbor, apt/helm qua Squid. Chạy với egress_temp_open=true lúc dựng (Squid chưa có).
- name: Cert TLS cho Harbor từ cert-manager
  hosts: "{{ groups['k8s_control_plane'][0] }}"
  become: true
  environment: { K8S_AUTH_KUBECONFIG: /etc/kubernetes/admin.conf }
  tasks:
    - name: Certificate harbor.{{ lab_domain }} (ký bởi lab-ca)
      kubernetes.core.k8s:
        wait: true
        wait_condition: { type: Ready, status: "True" }
        definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata: { name: harbor-tls, namespace: cert-manager }
          spec:
            secretName: harbor-tls
            dnsNames: ["{{ harbor_host }}"]
            ipAddresses: ["{{ svc_ip }}"]
            duration: 8760h
            issuerRef: { name: lab-ca, kind: ClusterIssuer }

    - name: Đọc cert
      kubernetes.core.k8s_info: { kind: Secret, namespace: cert-manager, name: harbor-tls }
      register: s
      no_log: true

    - name: Giữ cert để play sau dùng
      ansible.builtin.set_fact:
        harbor_tls:
          crt: "{{ s.resources[0].data['tls.crt'] | b64decode }}"
          key: "{{ s.resources[0].data['tls.key'] | b64decode }}"
      no_log: true

- name: Máy dịch vụ infra-01
  hosts: infra
  become: true
  roles: [base/egress_client, services/squid, services/harbor]

- name: Node kéo image qua Harbor, cài gói qua Squid
  hosts: k8s
  become: true
  roles: [base/egress_client]
- name: Kho S3 nội bộ trên infra-01
  hosts: infra
  become: true
  roles: [services/s3_garage]
