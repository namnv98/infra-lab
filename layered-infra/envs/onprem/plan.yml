# QUY HOẠCH MẠNG + MÁY của môi trường ON-PREM — NGUỒN DUY NHẤT của mọi IP (cùng cấu trúc với envs/gcp/plan.yml).
# ⚠ BẢN MẪU: IP minh hoạ, chưa có hệ thống thật. Xem inventories/onprem/README.md (phần nào dùng được ngay, phần nào phải làm thêm).
# Kiểm tra:  LAB_ENV=onprem python3 scripts/plan.py check  ·  cd ansible && ansible-inventory -i inventories/onprem/inventory.py --graph
# Khác GCP: mỗi vùng là 1 VLAN trên switch, FIREWALL CHÍNH LÀ GATEWAY (.1); có VLAN transit riêng giữa biên và core;
# không cần alias IP (kube-vip/MetalLB trả lời ARP thật); số card firewall không bị giới hạn theo vCPU.

platform: onprem
domain: lab.internal          # đổi theo tên miền nội bộ thật (vd. corp.internal)
mtu: 1500                     # MTU của switch/VLAN (jumbo frame: 9000 nếu cả đường đi hỗ trợ)

zones:
  wan:     { cidr: 203.0.113.0/29, gateway: 203.0.113.1 }                        # IP public nhà mạng cấp (dải tài liệu, thay bằng thật)
  transit: { cidr: 10.30.0.0/29,   gateway: 10.30.0.1, vlan: 30 }                 # chỉ 2 firewall: biên .1 ↔ core .2
  dmz:     { cidr: 10.10.10.0/24,  gateway: 10.10.10.1, fw: 10.10.10.1, vlan: 10 } # vùng biên — firewall biên làm gateway
  lan:     { cidr: 10.20.0.0/24,   gateway: 10.20.0.1,  fw: 10.20.0.1,  vlan: 20 } # core
  mgmt:    { cidr: 10.40.0.0/24,   gateway: 10.40.0.1,  fw: 10.40.0.1,  vlan: 40 } # core

# Đường vào trong của firewall biên: qua IP transit của core (route tĩnh trên biên)
extra_routes:
  - { name: edge-to-lan,  in: transit, to: lan,  via: firewall-core-01 }
  - { name: edge-to-mgmt, in: transit, to: mgmt, via: firewall-core-01 }

vpn: { cidr: 10.50.0.0/24, server: 10.50.0.1, admin: 10.50.0.2, port: 51820 }

k8s:
  api_vip: 10.20.0.10
  gateways:
    public:   { ip: 10.20.0.200, domain: apps.lab.internal }
    internal: { ip: 10.20.0.210, domain: int.lab.internal }
  metallb_pools:
    public:   10.20.0.200-10.20.0.209
    internal: 10.20.0.210-10.20.0.250

# 2 firewall OPNsense (máy vật lý hoặc VM). nics: card/VLAN theo thứ tự trong OPNsense; type chỉ là ghi chú phần cứng
firewalls:
  firewall-edge-01:
    role: edge
    type: "appliance 4 cổng"
    dns: 1.1.1.1
    nics:
      - { zone: transit, ip: 10.30.0.1,    if: lan,  descr: TRANSIT }
      - { zone: wan,     ip: 203.0.113.2,  if: wan,  default_gw: true }
      - { zone: dmz,     ip: 10.10.10.1,   if: opt1, descr: DMZ }
  firewall-core-01:
    role: core
    type: "appliance 6 cổng"
    dns: 10.30.0.1                       # hỏi DNS công cộng qua biên
    nics:
      - { zone: lan,     ip: 10.20.0.1,    if: lan }
      - { zone: transit, ip: 10.30.0.2,    if: wan,  descr: TRANSIT, default_gw: true }
      - { zone: mgmt,    ip: 10.40.0.1,    if: opt1, descr: MGMT }

# VM trên hypervisor (Proxmox/VMware…) — type/disk chỉ ghi chú, không có tofu tạo máy
hosts:
  k8s-master-01: { groups: [k8s_control_plane], zone: lan,  ip: 10.20.0.11,  type: "4 vCPU · 8GB", disk: 60 }
  k8s-master-02: { groups: [k8s_control_plane], zone: lan,  ip: 10.20.0.12,  type: "4 vCPU · 8GB", disk: 60 }
  k8s-master-03: { groups: [k8s_control_plane], zone: lan,  ip: 10.20.0.13,  type: "4 vCPU · 8GB", disk: 60 }
  k8s-worker-01: { groups: [k8s_workers],       zone: lan,  ip: 10.20.0.21,  type: "8 vCPU · 16GB", disk: 100 }
  k8s-worker-02: { groups: [k8s_workers],       zone: lan,  ip: 10.20.0.22,  type: "8 vCPU · 16GB", disk: 100 }
  infra-01:      { groups: [infra],             zone: lan,  ip: 10.20.0.30,  type: "4 vCPU · 8GB", disk: 500 }
  edge-01:       { groups: [edge],              zone: dmz,  ip: 10.10.10.10, type: "2 vCPU · 4GB", disk: 20 }
  siem-01:       { groups: [siem],              zone: mgmt, ip: 10.40.0.10,  type: "4 vCPU · 16GB", disk: 500 }
  jump-01:       { groups: [bastion],           zone: mgmt, ip: 10.40.0.20,  type: "2 vCPU · 2GB", disk: 20 }
