[defaults]
# inventory sinh từ ../envs/gcp/plan.yml (nguồn IP duy nhất)
inventory = inventories/gcp/inventory.py
roles_path = roles
host_key_checking = False
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
forks = 10
# Mọi SSH đi xuyên qua jump-01 (e2-micro): khi jump đang bận (vd. tự cài gói) bắt tay chậm → nới timeout
timeout = 30
log_path = ../out/logs/ansible.log

[ssh_connection]
# known_hosts riêng: IP trùng với lab local (k8s-lab) nhưng là máy khác
# ServerAlive: kết nối chết lặng (đi qua jump + 2 firewall) bị phát hiện sau ~60s → retries thay vì treo vô hạn
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=../out/known_hosts -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=4
pipelining = True
retries = 3
