# Bootstrap 2 firewall MỚI — giống nhau mọi môi trường. Chỉ chạy MỘT LẦN: network/site.yml gắn tag [bootstrap, never]
#   → chỉ chạy khi gọi đích danh:  make bootstrap  (= ansible-playbook network/site.yml --tags bootstrap,firewall)
# Điều kiện trước (việc của BƯỚC TẠO MÁY, playbook này không biết máy do ai tạo):
#   - 2 firewall đã cài OPNsense + nạp config bootstrap out/opnsense-<edge|core>-bootstrap.xml (make fw-config sinh ra)
#     GCP: make provision tự làm (metadata + console) · máy dựng tay: chép USB thành /conf/config.xml, hoặc nạp qua console/IPMI
#   - IP public của biên: fw_public_ip, vpn_public_ip (hosts.yml, hoặc provisioned.yml do bộ tạo máy ghi cạnh nó)
# Chạy lại trên firewall đã cấu hình sẽ lỗi: luật BOOTSTRAP (API qua IP public) đã bị xoá ở bước network.
#   ① chờ API biên qua IP public → ② biên dựng VPN → ③ máy admin bật VPN → ④ chờ API core xuyên VPN
#   → (tag firewall) cấu hình đủ cả hai, xoá luật BOOTSTRAP

- name: "① Chờ API firewall biên trên IP public"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Plan có IP public của biên và config bootstrap đã sinh
      ansible.builtin.assert:
        that:
          - fw_public_ip is defined and vpn_public_ip is defined
          - (lab_out ~ '/opnsense-edge-api.txt') is file
        fail_msg: >-
          Thiếu fw_public_ip/vpn_public_ip (bộ tạo máy ghi shared/inventory/provisioned.yml, máy có sẵn thì ghi tay vào hosts.yml)
          hoặc chưa chạy make fw-config

    - name: Chờ API firewall biên (https://{{ fw_public_ip }}) — firewall đã nạp config bootstrap chưa?
      ansible.builtin.uri:
        url: "https://{{ fw_public_ip }}/api/core/firmware/status"
        user: "{{ lookup('ansible.builtin.ini', 'key', file=lab_out ~ '/opnsense-edge-api.txt', type='properties') }}"
        password: "{{ lookup('ansible.builtin.ini', 'secret', file=lab_out ~ '/opnsense-edge-api.txt', type='properties') }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 5
      register: edge_api
      until: edge_api.status == 200 and 'product' in (edge_api.json | default({}))
      retries: 120
      delay: 5
      no_log: true

- name: "② Firewall biên: dựng VPN quản trị qua IP public"
  hosts: firewall-edge-01
  gather_facts: false
  roles:
    # tham số role: host_vars/firewall-edge-01.yml đặt opnsense_url qua VPN, ở đây (qua IP public) phải thắng nó
    - role: opnsense
      opnsense_url: "https://{{ fw_public_ip }}"
      opn_bootstrap: true      # chỉ WireGuard + luật VPN (opn_bootstrap_rules)

- name: "③④ Máy admin bật VPN, chờ API firewall core xuyên VPN"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Bật VPN trên máy admin (NetworkManager, Endpoint = IP VPN)
      ansible.builtin.command: "{{ lab_root }}/lab.sh vpn up"
      changed_when: true

    - name: Chờ API firewall core (card LAN, qua biên)
      ansible.builtin.uri:
        url: "https://{{ lan_fw }}/api/core/firmware/status"
        user: "{{ lookup('ansible.builtin.ini', 'key', file=lab_out ~ '/opnsense-core-api.txt', type='properties') }}"
        password: "{{ lookup('ansible.builtin.ini', 'secret', file=lab_out ~ '/opnsense-core-api.txt', type='properties') }}"
        force_basic_auth: true
        validate_certs: false
        timeout: 5
      register: core_api
      until: core_api.status == 200 and 'product' in (core_api.json | default({}))
      retries: 120
      delay: 5
      no_log: true
