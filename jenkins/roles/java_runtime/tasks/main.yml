# Cài Java: online → apt; offline → giải nén JRE từ bundle. Xuất fact jenkins_java_bin.
- name: Java from apt (online)
  ansible.builtin.apt:
    name: "{{ jenkins_java_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: jenkins_install_source == 'online'

- name: Java from bundle (offline)
  when: jenkins_install_source == 'offline'
  vars:
    arch: "{{ {'x86_64': 'x64', 'aarch64': 'aarch64'}[ansible_facts.architecture] | default(ansible_facts.architecture) }}"
    jre_file: "{{ jenkins_bundle.java[arch] | default('') }}"
  block:
    - name: Bundle has a JRE for this CPU
      ansible.builtin.assert:
        that: jre_file | length > 0
        fail_msg: "bundle/ không có JRE cho {{ arch }} — thêm '{{ arch }}' vào jenkins_bundle_arches rồi chạy lại bundle.yml"
        quiet: true

    - name: Java home
      ansible.builtin.file:
        path: "{{ jenkins_offline_java_home }}"
        state: directory
        mode: "0755"

    - name: Installed JRE version marker
      ansible.builtin.slurp:
        src: "{{ jenkins_offline_java_home }}/.bundle"
      register: jre_marker
      failed_when: false

    - name: Unpack JRE
      when: (jre_marker.content | default('') | b64decode | trim) != jre_file
      block:
        - name: Clean old JRE
          ansible.builtin.shell: rm -rf {{ jenkins_offline_java_home | quote }}/*
          changed_when: true

        - name: Unpack
          ansible.builtin.unarchive:
            src: "{{ jenkins_bundle_dir }}/{{ jre_file }}"
            dest: "{{ jenkins_offline_java_home }}"
            extra_opts: [--strip-components=1]

        - name: Write marker
          ansible.builtin.copy:
            dest: "{{ jenkins_offline_java_home }}/.bundle"
            content: "{{ jre_file }}\n"
            mode: "0644"

- name: Java binary path
  ansible.builtin.set_fact:
    jenkins_java_bin: "{{ '/usr/bin/java' if jenkins_install_source == 'online' else jenkins_offline_java_home ~ '/bin/java' }}"
