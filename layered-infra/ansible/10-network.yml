# Mạng: 2 firewall (luật, NAT, DNS, syslog) + bastion + DNS/NTP cho mọi VM. Chạy lại sau mỗi lần sửa luật.
#   Luật OPNsense phải có TRƯỚC khi VM đổi DNS/NTP sang firewall.
- name: Cấu hình 2 firewall OPNsense qua API (biên + core, gọi xuyên VPN)
  hosts: firewalls
  gather_facts: false
  roles: [network/opnsense]

- name: "Jump server (bastion): siết SSH, ghi lại phiên làm việc"
  hosts: bastion
  become: true
  roles: [security/bastion]

- name: Mọi VM dùng DNS, NTP của OPNsense
  hosts: linux
  become: true
  roles: [base/network]

- name: CoreDNS đọc lại DNS upstream mới
  hosts: "{{ groups['k8s_control_plane'][0] }}"
  become: true
  tasks:
    # dựng lần đầu: 10-network.yml chạy trước site.yml nên chưa có cluster → bỏ qua
    - name: Kiểm tra cluster đã khởi tạo chưa
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: Restart CoreDNS
      ansible.builtin.shell: |
        kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system rollout restart deploy/coredns
        kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system rollout status deploy/coredns --timeout=120s
      when:
        - admin_conf.stat.exists
        - groups['k8s'] | map('extract', hostvars, 'dns_changed') | select | list | length > 0
