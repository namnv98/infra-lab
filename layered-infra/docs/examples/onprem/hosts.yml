# VÍ DỤ inventory khi chạy ON-PREM — Ansible KHÔNG đọc file này. Cùng cấu trúc với ansible/shared/inventory/hosts.yml.
# Chuyển lab sang on-prem: chép nội dung file này (đã sửa IP thật) đè lên ansible/shared/inventory/hosts.yml,
# chép firewall-*.yml cạnh đây đè lên ansible/network/host_vars/, rồi make lint. Xem README.md cạnh file này.
# ⚠ IP minh hoạ, chưa có hệ thống thật.
# Khác GCP: mỗi vùng là 1 VLAN trên switch, FIREWALL CHÍNH LÀ GATEWAY (.1); có VLAN transit riêng giữa biên và core;
# không cần alias IP (kube-vip/MetalLB trả lời ARP thật); số card firewall không bị giới hạn theo vCPU.
all:
  vars:
    lab_hosting: onprem
    lab_domain: lab.internal          # đổi theo tên miền nội bộ thật (vd. corp.internal)
    lab_mtu: 1500                     # MTU của switch/VLAN (jumbo frame: 9000 nếu cả đường đi hỗ trợ)

    # VM Linux: card mạng chính, IP tĩnh do Ansible ghi netplan (gateway = firewall của VLAN), Ubuntu cài thường dùng timesyncd
    node_interface: enp1s0
    node_network_mode: static
    ntp_client: systemd-timesyncd

    # IP public của firewall biên (= card WAN, VPN dùng chung IP này)
    fw_public_ip: 203.0.113.2
    vpn_public_ip: 203.0.113.2

    zones:
      wan:     { cidr: 203.0.113.0/29, gateway: 203.0.113.1 }                        # IP public nhà mạng cấp (dải tài liệu, thay bằng thật)
      transit: { cidr: 10.30.0.0/29,   gateway: 10.30.0.1, vlan: 30 }                 # chỉ 2 firewall: biên .1 ↔ core .2
      dmz:     { cidr: 10.10.10.0/24,  gateway: 10.10.10.1, fw: 10.10.10.1, vlan: 10 } # vùng biên — firewall biên làm gateway
      lan:     { cidr: 10.20.0.0/24,   gateway: 10.20.0.1,  fw: 10.20.0.1,  vlan: 20 } # core
      mgmt:    { cidr: 10.40.0.0/24,   gateway: 10.40.0.1,  fw: 10.40.0.1,  vlan: 40 } # core

    # Đường vào trong của firewall biên: qua IP transit của core (route tĩnh trên biên)
    extra_routes:
      - { name: edge-to-lan,  in: transit, to: lan,  via: firewall-core-01 }
      - { name: edge-to-mgmt, in: transit, to: mgmt, via: firewall-core-01 }

    vpn: { cidr: 10.50.0.0/24, server: 10.50.0.1, admin: 10.50.0.2, port: 51820 }

    api_vip: 10.20.0.10
    gateways:
      public:   { ip: 10.20.0.200, domain: apps.lab.internal }
      internal: { ip: 10.20.0.210, domain: int.lab.internal }
    metallb_pools:
      public:   10.20.0.200-10.20.0.209
      internal: 10.20.0.210-10.20.0.250

  children:
    # 2 firewall OPNsense (máy vật lý hoặc VM). nics: card/VLAN theo thứ tự trong OPNsense; machine_type chỉ là ghi chú phần cứng
    firewalls:
      hosts:
        firewall-edge-01:
          fw_role: edge
          machine_type: "appliance 4 cổng"
          fw_dns: 1.1.1.1
          nics:
            - { zone: transit, ip: 10.30.0.1,    if: lan,  descr: TRANSIT }
            - { zone: wan,     ip: 203.0.113.2,  if: wan,  default_gw: true }
            - { zone: dmz,     ip: 10.10.10.1,   if: opt1, descr: DMZ }
        firewall-core-01:
          fw_role: core
          machine_type: "appliance 6 cổng"
          fw_dns: 10.30.0.1                  # hỏi DNS công cộng qua biên
          nics:
            - { zone: lan,     ip: 10.20.0.1,    if: lan }
            - { zone: transit, ip: 10.30.0.2,    if: wan,  descr: TRANSIT, default_gw: true }
            - { zone: mgmt,    ip: 10.40.0.1,    if: opt1, descr: MGMT }

    # VM tạo bằng bất kỳ cách nào (Proxmox/VMware/máy thật) — machine_type/disk_gb chỉ ghi chú; chỉ cần chạy đúng IP dưới đây
    linux:
      children:
        k8s:
          children:
            k8s_control_plane:
              hosts:
                k8s-master-01: { ansible_host: 10.20.0.11, zone: lan, machine_type: "4 vCPU · 8GB", disk_gb: 60 }
                k8s-master-02: { ansible_host: 10.20.0.12, zone: lan, machine_type: "4 vCPU · 8GB", disk_gb: 60 }
                k8s-master-03: { ansible_host: 10.20.0.13, zone: lan, machine_type: "4 vCPU · 8GB", disk_gb: 60 }
            k8s_workers:
              hosts:
                k8s-worker-01: { ansible_host: 10.20.0.21, zone: lan, machine_type: "8 vCPU · 16GB", disk_gb: 100 }
                k8s-worker-02: { ansible_host: 10.20.0.22, zone: lan, machine_type: "8 vCPU · 16GB", disk_gb: 100 }
        infra:
          hosts:
            infra-01: { ansible_host: 10.20.0.30, zone: lan, machine_type: "4 vCPU · 8GB", disk_gb: 500 }
        edge:
          hosts:
            edge-01: { ansible_host: 10.10.10.10, zone: dmz, machine_type: "2 vCPU · 4GB", disk_gb: 20 }
        siem:
          hosts:
            siem-01: { ansible_host: 10.40.0.10, zone: mgmt, machine_type: "4 vCPU · 16GB", disk_gb: 500 }
        bastion:
          hosts:
            jump-01: { ansible_host: 10.40.0.20, zone: mgmt, machine_type: "2 vCPU · 2GB", disk_gb: 20 }
