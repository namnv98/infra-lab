velero_chart_version: 12.2.1                 # Velero 1.18.2
velero_image_tag: v1.18.2
velero_aws_plugin: velero/velero-plugin-for-aws:v1.14.4
velero_s3_url: "http://{{ svc_ip }}:3900"    # Garage trên infra-01 (role services/s3_garage)
velero_schedule: "0 2 * * *"                 # backup toàn cluster 02:00 hằng ngày
velero_ttl: 168h                             # giữ 7 ngày
# Cùng file secret với role services/s3_garage (play infra-01 chạy trước, đã tạo file)
# Key/secret: platform/group_vars/all/secrets.yml (dùng chung với kho S3)
velero_s3_key_id: "{{ s3_velero_key_id }}"
velero_s3_secret: "{{ s3_velero_secret }}"
