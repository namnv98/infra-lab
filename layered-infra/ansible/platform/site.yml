# Team PLATFORM: Kubernetes, addon, Harbor + S3 trên infra-01, app, bảo mật cluster, Prometheus, backup.
# Chỉ đọc shared/ (inventory hosts.yml + hợp đồng); không gọi role/biến của team khác. Thứ tự giữa các team: lab.sh cluster.
#   Chạy lẻ:  ansible-playbook platform/site.yml --tags security
# Tag: kubernetes (coredns) · addons · services · apps · prewarm · security · metrics · backup
- name: "Kubernetes"
  ansible.builtin.import_playbook: 20-kubernetes.yml
  tags: [kubernetes]
- name: "Addon cluster"
  ansible.builtin.import_playbook: 30-cluster-addons.yml
  tags: [addons]
- name: "Dịch vụ dùng chung"
  ansible.builtin.import_playbook: 40-shared-services.yml
  tags: [services]
- name: "App + cert vùng biên"
  ansible.builtin.import_playbook: 50-apps.yml
  tags: [apps]
- name: "Nạp cache Harbor"
  ansible.builtin.import_playbook: ops-harbor-prewarm.yml
  tags: [prewarm]
- name: "Bảo mật"
  ansible.builtin.import_playbook: 60-security.yml
  tags: [security]
- name: "Metric (Prometheus)"
  ansible.builtin.import_playbook: 70-metrics.yml
  tags: [metrics]
- name: "Backup"
  ansible.builtin.import_playbook: 80-backup.yml
  tags: [backup]
