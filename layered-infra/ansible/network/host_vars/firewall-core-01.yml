# firewall-core-01: firewall CORE. Card: wan = DMZ (card ngoài, gateway → biên), lan, opt1 = MGMT.
# Không IP public, không VPN, KHÔNG NAT (bootstrap đặt outbound NAT = disabled): biên phải thấy IP thật của LAN/MGMT.
opn_role: core
opnsense_url: "https://{{ zones.lan.fw }}"   # qua VPN, đi xuyên biên
opnsense_api_file: "{{ lab_out }}/opnsense-core-api.txt"

opn_rules:
  # --- DMZ ("wan" của core): chỉ đúng các nguồn sau được vào trong; mọi IP DMZ khác (kể cả nguồn giả) bị chặn ---
  - { sequence: "10", interface: wan, action: pass,  protocol: TCP,     source_net: haproxy_dmz, destination_net: gw_public,   destination_port: web_ports,    description: "edge-01 → Gateway public (80,443)" }
  - { sequence: "25", interface: wan, action: pass,  protocol: TCP/UDP, source_net: haproxy_dmz, destination_net: mon_host,    destination_port: syslog_ports, description: "edge-01 → siem-01 syslog" }
  - { sequence: "26", interface: wan, action: pass,  protocol: TCP,     source_net: haproxy_dmz, destination_net: mon_host,    destination_port: wazuh_ports,  description: "edge-01 → Wazuh manager" }
  - { sequence: "27", interface: wan, action: pass,  protocol: TCP,     source_net: fw_edge_dmz, destination_net: mon_host,    destination_port: syslog_ports,    description: "firewall biên → siem-01 syslog" }
  - { sequence: "40", interface: wan, action: pass,  protocol: TCP,     source_net: admin_hosts, destination_net: jump_host,   destination_port: "22",         description: "VPN admin (qua biên) → jump server" }
  - { sequence: "41", interface: wan, action: pass,  protocol: ICMP,    source_net: admin_hosts, destination_net: jump_host,                                   description: "VPN admin (qua biên) → ping jump server" }
  - { sequence: "42", interface: wan, action: pass,  protocol: TCP,     source_net: admin_hosts, destination_net: fw_core_lan, destination_port: "443",        description: "VPN admin (qua biên) → GUI/API firewall core" }
  - { sequence: "43", interface: wan, action: pass,  protocol: TCP/UDP, source_net: admin_hosts, destination_net: fw_core_lan, destination_port: "53",         description: "VPN admin (qua biên) → DNS nội bộ" }
  - { sequence: "49", interface: wan, action: block, protocol: any,     source_net: any,         destination_net: any, log: "1",                              description: "DMZ → vào trong: CHẶN (ghi log)" }
  # --- LAN: chặn mặc định, chỉ mở thứ cần ---
  - { sequence: "100", interface: lan, action: pass,  protocol: TCP/UDP, source_net: lan, destination_net: lanip,     destination_port: "53",        description: "LAN → DNS của OPNsense" }
  - { sequence: "110", interface: lan, action: pass,  protocol: UDP,     source_net: lan, destination_net: lanip,     destination_port: "123",       description: "LAN → NTP của OPNsense" }
  - { sequence: "120", interface: lan, action: pass,  protocol: ICMP,    source_net: lan, destination_net: any,                                      description: "LAN → ICMP (ping để debug)" }
  - { sequence: "130", interface: lan, action: pass,  protocol: TCP,     source_net: lan, destination_net: wan,       destination_port: admin_ports, description: "LAN → DMZ quản trị (22,80,443)" }
  - { sequence: "140", interface: lan, action: pass,  protocol: TCP,     source_net: svc_hosts, destination_net: any, destination_port: web_ports,   description: "infra-01 → Internet 80/443 (Harbor, Squid)" }
  - { sequence: "150", interface: lan, action: pass,  protocol: TCP,     source_net: lan, destination_net: any,       destination_port: web_ports,   description: "TẠM: LAN → Internet 80/443", enabled: "{{ '1' if egress_temp_open else '0' }}" }
  - { sequence: "160", interface: lan, action: pass,  protocol: TCP/UDP, source_net: lan, destination_net: mon_host, destination_port: syslog_ports, description: "LAN → siem-01 syslog" }
  - { sequence: "165", interface: lan, action: pass,  protocol: TCP,     source_net: lan, destination_net: mon_host, destination_port: wazuh_ports, description: "LAN → Wazuh manager" }
  - { sequence: "190", interface: lan, action: block, protocol: any,     source_net: lan, destination_net: any,       log: "1",                      description: "LAN → mọi nơi khác: CHẶN (ghi log)" }

  # --- MGMT (opt1 trên core): chỉ ra được DNS/NTP của firewall và Harbor/Squid; mọi thứ khác chặn ---
  - { sequence: "200", interface: opt1, action: pass,  protocol: TCP/UDP, source_net: opt1, destination_net: opt1ip,   destination_port: "53",      description: "MGMT → DNS của OPNsense" }
  - { sequence: "210", interface: opt1, action: pass,  protocol: UDP,     source_net: opt1, destination_net: opt1ip,   destination_port: "123",     description: "MGMT → NTP của OPNsense" }
  - { sequence: "205", interface: opt1, action: pass,  protocol: TCP,     source_net: jump_host, destination_net: RFC1918, destination_port: jump_admin_ports, description: "jump server → máy trong (quản trị)" }
  - { sequence: "206", interface: opt1, action: pass,  protocol: ICMP,    source_net: jump_host, destination_net: RFC1918, description: "jump server → ping" }
  - { sequence: "215", interface: opt1, action: pass,  protocol: TCP,     source_net: mon_host, destination_net: gw_internal, destination_port: "443", description: "siem-01 → Gateway internal (Grafana đọc Prometheus)" }
  - { sequence: "220", interface: opt1, action: pass,  protocol: TCP,     source_net: opt1, destination_net: svc_hosts, destination_port: svc_ports, description: "MGMT → Harbor, Squid" }
  - { sequence: "290", interface: opt1, action: block, protocol: any,     source_net: opt1, destination_net: any,      log: "1",                    description: "MGMT → mọi nơi khác: CHẶN (ghi log)" }

# Luật mặc định của hãng cần tắt (thay bằng các luật LAN ở trên)
opn_disabled_rules: ["Default allow LAN to any rule", "Default allow LAN IPv6 to any rule"]
