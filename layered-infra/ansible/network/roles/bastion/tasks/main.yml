# Jump server (bastion): cửa duy nhất từ VPN vào các máy bên trong.
# Không cài gói (MGMT chưa ra được Internet lúc network/10-firewall.yml chạy) — chỉ siết SSH và ghi lại phiên làm việc.
- name: SSH chỉ cho đăng nhập bằng khoá, user ubuntu; cho chuyển tiếp TCP (ssh -J / -W / -D đi xuyên qua)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-bastion.conf
    content: |
      # Do Ansible quản lý (role bastion, team network)
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AuthenticationMethods publickey
      AllowUsers ubuntu
      MaxAuthTries 3
      LoginGraceTime 30
      ClientAliveInterval 300
      ClientAliveCountMax 2
      AllowTcpForwarding yes
      AllowAgentForwarding no
      X11Forwarding no
      PermitTunnel no
      GatewayPorts no
      LogLevel VERBOSE
    mode: "0644"
    validate: sshd -t -f %s
  notify: Reload ssh

# pam_tty_audit: auditd ghi lại phím gõ trong phiên SSH (kiểu PAM ghi phiên); log_passwd tắt nên mật khẩu không bị ghi.
# auditd đẩy sang syslog → siem-01 (role auditd trong observability/site.yml).
- name: Ghi lại phiên SSH bằng pam_tty_audit
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sshd
    line: "session required pam_tty_audit.so enable=*"
    insertafter: EOF

- name: Banner cảnh báo khi đăng nhập
  ansible.builtin.copy:
    dest: /etc/issue.net
    content: |
      Jump server của lab. Mọi phiên làm việc được ghi lại và gửi về SIEM.
    mode: "0644"

- name: Hiện banner
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/11-banner.conf
    content: "Banner /etc/issue.net\n"
    mode: "0644"
    validate: sshd -t -f %s
  notify: Reload ssh
