; Chế độ cài được quyết định bởi inventory:
;   - [jenkins_agents] trống  → standalone: job chạy ngay trên controller
;   - [jenkins_agents] có host → controller + agent: controller không chạy job,
;                                job chạy trên agent (controller SSH vào agent)
; Chuyển chế độ bất cứ lúc nào: thêm/xóa host trong [jenkins_agents] rồi chạy lại ./install.sh
;   (vd. cài standalone trước, sau thêm agent → controller tự về 0 executor, node mới tự xuất hiện)
; Luôn chạy kèm controller — agent cần public key của controller, controller phải sinh lại JCasC:
;   ./install.sh                                       # toàn bộ
;   ./install.sh --limit 'jenkins_controller:agent-3'  # chỉ controller + agent mới
; Hệ điều hành: online → Ubuntu/Debian; offline → mọi Linux dùng systemd (xem group_vars/all/settings.yml)

[jenkins_controller]
jenkins ansible_host=203.0.113.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519

[jenkins_agents]
; agent-1 ansible_host=203.0.113.11 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519
; agent-2 ansible_host=10.0.0.12 ansible_user=ubuntu jenkins_agent_labels="linux docker" jenkins_agent_executors=4

[jenkins_all:children]
jenkins_controller
jenkins_agents
