# Plugin: online → plugin manager tải từ update center; offline → giải nén plugins.tar.gz từ bundle
- name: Plugins dir
  ansible.builtin.file:
    path: "{{ jenkins_home }}/plugins"
    state: directory
    owner: jenkins
    group: jenkins
    mode: "0755"

- name: Plugins (online)
  ansible.builtin.import_tasks: plugins_online.yml
  when: jenkins_install_source == 'online'

- name: Plugins (offline)
  ansible.builtin.import_tasks: plugins_offline.yml
  when: jenkins_install_source == 'offline'

- name: Verify all plugins are present
  ansible.builtin.stat:
    path: "{{ jenkins_home }}/plugins/{{ item }}.jpi"
  loop: "{{ jenkins_plugins }}"
  register: plugin_files
  failed_when: not plugin_files.stat.exists
