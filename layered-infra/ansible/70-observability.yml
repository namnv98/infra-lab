# Quan sát: Prometheus trong cluster (tag metrics) + SIEM, log/audit/Wazuh agent mọi máy (tag siem).
#   lab.sh chạy song song: "--tags security,metrics" ‖ "--tags siem" (Helm không được chạy lúc apiserver khởi động lại).
- name: Prometheus + node-exporter + kube-state-metrics
  tags: [metrics]
  hosts: "{{ groups['k8s_control_plane'][0] }}"
  become: true
  environment: "{{ egress_env | combine({'K8S_AUTH_KUBECONFIG': '/etc/kubernetes/admin.conf', 'KUBECONFIG': '/etc/kubernetes/admin.conf'}) }}"
  roles:
    - observability/prometheus
- name: Bản sao log trên infra-01 (phải có trước khi Alloy ghi song song)
  tags: [siem]
  hosts: infra
  become: true
  roles: [observability/loki_replica]

- name: siem-01 (VLAN MGMT) chạy Loki + Alloy + Grafana + Mailpit
  tags: [siem]
  hosts: siem
  become: true
  roles: [observability/siem]

- name: 2 firewall OPNsense gửi syslog về siem-01
  tags: [siem]
  hosts: firewalls
  gather_facts: false
  roles: [network/opnsense]

- name: Mọi máy Linux gửi log về siem-01 bằng rsyslog
  tags: [siem]
  hosts: linux
  become: true
  roles: [observability/log_forwarder]

- name: auditd trên mọi máy Linux (danh tính, persistence, user dịch vụ chạy lệnh)
  tags: [siem]
  hosts: linux
  become: true
  environment: "{{ egress_env }}"
  roles: [observability/auditd, base/quiet_os]

- name: Wazuh agent trên mọi máy Linux (gửi về manager trên siem-01)
  tags: [siem]
  hosts: linux:!siem
  become: true
  environment: "{{ egress_env }}"
  roles: [observability/wazuh_agent]
