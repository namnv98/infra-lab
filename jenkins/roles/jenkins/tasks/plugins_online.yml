# Online: plugin manager tải plugin còn thiếu (kèm dependency) từ update center
- name: Plugin manager jar
  ansible.builtin.get_url:
    url: "https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/{{ jenkins_plugin_manager_version }}/jenkins-plugin-manager-{{ jenkins_plugin_manager_version }}.jar"
    checksum: "sha256:https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/{{ jenkins_plugin_manager_version }}/jenkins-plugin-manager-{{ jenkins_plugin_manager_version }}.jar.sha256"
    dest: /opt/jenkins-plugin-manager.jar
    mode: "0644"

- name: List installed plugins
  ansible.builtin.find:
    paths: "{{ jenkins_home }}/plugins"
    patterns: "*.jpi,*.hpi"
  register: installed_plugins

- name: Install missing plugins
  ansible.builtin.command: >
    {{ jenkins_java_bin }} -jar /opt/jenkins-plugin-manager.jar
    --war {{ jenkins_war }}
    --plugin-download-directory {{ jenkins_home }}/plugins
    --plugins {{ missing | join(' ') }}
  vars:
    installed: "{{ installed_plugins.files | map(attribute='path') | map('basename') | map('regex_replace', '\\.[jh]pi$', '') | list }}"
    missing: "{{ jenkins_plugins | difference(installed) }}"
  become_user: jenkins
  when: missing | length > 0
  register: plugins_online
  retries: 3
  delay: 10
  until: plugins_online is succeeded
