# Cluster kubeadm: chuẩn bị node, init/join control plane (kube-vip, Cilium), join worker, kiểm tra.
- name: Chuẩn bị mọi node (kernel, containerd, kubeadm)
  hosts: k8s
  become: true
  environment: "{{ egress_env }}"
  roles: [k8s/node_prep, k8s/containerd]

- name: Control plane HA (k8s-master-01 init, rồi lần lượt từng master join để etcd luôn giữ quorum)
  hosts: k8s_control_plane
  become: true
  serial: 1
  environment: "{{ egress_env }}"
  roles:
    - k8s/control_plane
    - { role: k8s/cilium, when: inventory_hostname == first_cp }

- name: Join worker vào cluster
  hosts: k8s_workers
  become: true
  roles: [k8s/worker]

- name: Kiểm tra cluster
  hosts: "{{ groups['k8s_control_plane'][0] }}"
  become: true
  tasks:
    - name: Chờ Cilium chạy ổn trên mọi node
      ansible.builtin.command: cilium status --wait --wait-duration 5m
      environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
      changed_when: false

    - name: Chờ mọi node Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=300s
      environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
      changed_when: false

    - name: Lấy danh sách node
      ansible.builtin.command: kubectl get nodes -o wide
      environment: { KUBECONFIG: /etc/kubernetes/admin.conf }
      register: nodes
      changed_when: false

    - name: In danh sách node
      ansible.builtin.debug: { msg: "{{ nodes.stdout_lines }}" }
