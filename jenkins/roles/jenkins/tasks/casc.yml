# ---------------- Ghi cấu hình ----------------
- name: Trust agent host keys
  ansible.builtin.known_hosts:
    path: "{{ jenkins_home }}/.ssh/known_hosts"
    name: "{{ hostvars[item].jenkins_agent_address }}"
    key: "{{ hostvars[item].jenkins_agent_address }} {{ hostvars[item].jenkins_agent_hostkey }}"
  loop: "{{ groups['jenkins_agents'] | default([]) }}"
  become_user: jenkins

- name: CasC dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: jenkins
    mode: "0750"
  loop: [ /etc/jenkins, "{{ jenkins_casc_dir }}", /etc/jenkins/secrets ]

- name: Admin password secret
  ansible.builtin.copy:
    dest: /etc/jenkins/secrets/admin_password
    content: "{{ jenkins_admin_password }}"
    owner: root
    group: jenkins
    mode: "0640"
  no_log: true
  register: admin_secret

- name: jenkins.yaml (JCasC)
  ansible.builtin.template:
    src: jenkins.yaml.j2
    dest: "{{ jenkins_casc_dir }}/jenkins.yaml"
    owner: root
    group: jenkins
    mode: "0640"
  register: casc_file

# ---------------- Áp dụng thay đổi ----------------
# Quyết định 1 lần, theo thứ tự ưu tiên:
#   restart : đổi service / war / plugin (cờ từ main.yml) — Jenkins phải khởi động lại
#   reload  : chỉ đổi JCasC hoặc mật khẩu admin — nạp lại cấu hình, không ngắt job đang chạy
#   none    : không đổi gì
# Jenkins đang tắt thì "Ensure running" khởi động nó với cấu hình mới → không cần reload nữa.
- name: Decide restart / reload
  ansible.builtin.set_fact:
    jenkins_apply: >-
      {{ 'restart' if jenkins_restart_needed | bool
         else 'reload' if (casc_file is changed or admin_secret is changed)
         else 'none' }}

# Nếu trước đó Jenkins crash-loop, systemd chặn start ("Start request repeated too quickly")
- name: Clear systemd start-limit state
  ansible.builtin.command: systemctl reset-failed jenkins
  changed_when: false
  failed_when: false

- name: Restart Jenkins
  ansible.builtin.systemd:
    name: jenkins
    state: restarted
    enabled: true
    daemon_reload: true
  when: jenkins_apply == 'restart'

- name: Ensure Jenkins is running
  ansible.builtin.systemd:
    name: jenkins
    state: started
  register: started

- name: Wait for Jenkins (login page)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jenkins_http_port }}/login"
  register: ui
  until: ui.status == 200
  retries: 60
  delay: 5

- name: Reload JCasC (no restart)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jenkins_http_port }}/reload-configuration-as-code/?casc-reload-token={{ jenkins_casc_reload_token }}"
    method: POST
    status_code: [200, 302]
  when: jenkins_apply == 'reload' and started is not changed
  no_log: true

- name: Check agents are online
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jenkins_http_port }}/computer/{{ item }}/api/json?tree=offline"
    url_username: "{{ jenkins_admin_user }}"
    url_password: "{{ jenkins_admin_password }}"
    force_basic_auth: true
  register: node
  until: node.json is defined and not node.json.offline
  retries: 24
  delay: 5
  loop: "{{ groups['jenkins_agents'] | default([]) }}"
  no_log: true

- name: Show access info
  ansible.builtin.debug:
    msg:
      - "Source: {{ jenkins_install_source }} — Mode: {{ 'controller + ' ~ (groups['jenkins_agents'] | length) ~ ' agent(s)' if groups['jenkins_agents'] | default([]) | length > 0 else 'standalone' }}"
      - "URL: {{ jenkins_url }}"
      - "User: {{ jenkins_admin_user }} — password: credentials/jenkins_admin_password (trên máy chạy Ansible)"
