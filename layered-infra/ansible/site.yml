# TOÀN BỘ quy trình dựng, đúng thứ tự. Bootstrap firewall (tag bootstrap) chỉ chạy khi gọi đích danh — xem 00-firewall-bootstrap.yml.
#   Dựng mới:   ./lab.sh cluster   (gọi file này theo tag, xem lab.sh)
#   Chạy lẻ:    ansible-playbook site.yml --tags network   (vd. sau khi sửa luật firewall)
# Tag: bootstrap (never) · network · kubernetes · addons · services · apps · prewarm · security · observability (metrics, siem) · backup
- name: "Bootstrap 2 firewall mới tạo (chỉ khi gọi --tags bootstrap)"
  ansible.builtin.import_playbook: 00-firewall-bootstrap.yml
  tags: [bootstrap, never]
- name: "Mạng: 2 firewall, bastion, DNS/NTP"
  ansible.builtin.import_playbook: 10-network.yml
  tags: [network]
- name: "Kubernetes"
  ansible.builtin.import_playbook: 20-kubernetes.yml
  tags: [kubernetes]
- name: "Addon cluster"
  ansible.builtin.import_playbook: 30-cluster-addons.yml
  tags: [addons]
- name: "Dịch vụ dùng chung"
  ansible.builtin.import_playbook: 40-shared-services.yml
  tags: [services]
- name: "App + vùng biên"
  ansible.builtin.import_playbook: 50-apps-edge.yml
  tags: [apps]
- name: "Nạp cache Harbor"
  ansible.builtin.import_playbook: ops-harbor-prewarm.yml
  tags: [prewarm]
- name: "Bảo mật"
  ansible.builtin.import_playbook: 60-security.yml
  tags: [security]
- name: "Quan sát (metric, SIEM)"
  ansible.builtin.import_playbook: 70-observability.yml
  tags: [observability]
- name: "Backup"
  ansible.builtin.import_playbook: 80-backup.yml
  tags: [backup]
