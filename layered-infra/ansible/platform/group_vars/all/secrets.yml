# Bí mật của platform do Ansible sinh. lookup('password') sinh ngẫu nhiên lần đầu, ghi vào out/ (gitignore),
# các lần sau đọc lại → chạy lại không đổi mật khẩu. Bí mật của observability: observability/group_vars/all/secrets.yml;
# do script sinh (OPNsense, WireGuard — network): out/opnsense-*, out/wg-*.
harbor_admin_password_file: "{{ lab_out }}/harbor-admin.txt"
harbor_admin_password: "{{ lookup('ansible.builtin.password', harbor_admin_password_file, chars=['ascii_letters', 'digits'], length=20) }}"
harbor_db_password: "{{ lookup('ansible.builtin.password', lab_out ~ '/harbor-db.txt', chars=['ascii_letters', 'digits'], length=20) }}"
# Kho S3 (Garage) và Velero dùng chung 1 cặp key. Garage yêu cầu key id dạng GK + 24 hex, secret 64 hex.
s3_velero_key_id: "GK{{ lookup('ansible.builtin.password', lab_out ~ '/s3-velero-key-id.txt', chars=['0123456789abcdef'], length=24) }}"
s3_velero_secret: "{{ lookup('ansible.builtin.password', lab_out ~ '/s3-velero-secret.txt', chars=['0123456789abcdef'], length=64) }}"
garage_rpc_secret: "{{ lookup('ansible.builtin.password', lab_out ~ '/garage-rpc.txt', chars=['0123456789abcdef'], length=64) }}"
garage_admin_token: "{{ lookup('ansible.builtin.password', lab_out ~ '/garage-admin.txt', chars=['ascii_letters', 'digits'], length=32) }}"
