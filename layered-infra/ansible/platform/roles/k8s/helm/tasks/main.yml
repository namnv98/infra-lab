- name: Cài helm {{ helm_version }}
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: [--strip-components=1, linux-amd64/helm]
    creates: /usr/local/bin/helm

- name: Thư viện python cho module kubernetes.core
  ansible.builtin.apt:
    name: [python3-kubernetes, python3-yaml]
