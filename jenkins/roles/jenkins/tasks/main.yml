# Cài Jenkins controller. Cấu hình JCasC + restart/reload ở casc.yml (chạy ở play 4, sau khi agent xong).
- name: Java
  ansible.builtin.include_role:
    name: java_runtime

# import (không phải include) để task bị skip vẫn đăng ký biến → dùng được trong cờ restart bên dưới
- name: Install (online)
  ansible.builtin.import_tasks: install_online.yml
  when: jenkins_install_source == 'online'

- name: Install (offline)
  ansible.builtin.import_tasks: install_offline.yml
  when: jenkins_install_source == 'offline'

- name: Service config
  ansible.builtin.import_tasks: service.yml

- name: Plugins
  ansible.builtin.import_tasks: plugins.yml

- name: SSH key for agents
  ansible.builtin.import_tasks: ssh_key.yml

# Có thay đổi cần restart Jenkins? Chưa restart ở đây — Jenkins chỉ boot được khi đã có file JCasC (casc.yml).
- name: Restart flag for casc.yml
  ansible.builtin.set_fact:
    jenkins_restart_needed: >-
      {{ dropin is changed or war_copy is changed or unit_file is changed
         or plugins_online is changed or plugins_offline is changed }}
