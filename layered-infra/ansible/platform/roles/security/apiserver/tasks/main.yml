# Bật audit log, mã hoá Secret trong etcd, tắt profiling (đóng các mục FAIL của kube-bench 1.2.x/1.3.x/1.4.x).
# Chỉ hỗ trợ 1 control-plane; với nhiều master phải chạy lần lượt trên từng máy, dùng CHUNG một khoá mã hoá.
- name: Chỉ hỗ trợ 1 control-plane
  ansible.builtin.assert:
    that: groups['k8s_control_plane'] | length == 1

- name: Thư mục cấu hình
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop: [/etc/kubernetes/audit, /etc/kubernetes/enc, /var/log/kubernetes/audit]

- name: Audit policy
  ansible.builtin.template:
    src: audit-policy.yaml.j2
    dest: /etc/kubernetes/audit/policy.yaml
    mode: "0600"
  register: policy

# Khoá sinh ngay trên k8s-master-01, không rời khỏi máy. Mất khoá = mất toàn bộ Secret (backup etcd cũng vô dụng).
- name: Sinh khoá mã hoá (chỉ lần đầu)
  ansible.builtin.shell: |
    set -e
    key=$(head -c 32 /dev/urandom | base64)
    cat > /etc/kubernetes/enc/encryption-config.yaml <<EOF
    apiVersion: apiserver.config.k8s.io/v1
    kind: EncryptionConfiguration
    resources:
      - resources: [secrets]
        providers:
          - secretbox:
              keys:
                - name: key1
                  secret: ${key}
          - identity: {}     # vẫn đọc được Secret cũ chưa mã hoá
    EOF
    chmod 600 /etc/kubernetes/enc/encryption-config.yaml
  args:
    creates: /etc/kubernetes/enc/encryption-config.yaml
  register: enc

- name: ClusterConfiguration
  ansible.builtin.template:
    src: kubeadm-cluster.yaml.j2
    dest: /etc/kubernetes/kubeadm-cluster.yaml
    mode: "0600"
  register: cfg

- name: Sinh lại manifest control plane theo cấu hình mới
  ansible.builtin.command: kubeadm init phase control-plane all --config /etc/kubernetes/kubeadm-cluster.yaml
  when: cfg is changed or policy is changed or enc is changed

- name: Lưu cấu hình vào cluster (để kubeadm upgrade/join sau này dùng đúng)
  ansible.builtin.command: kubeadm init phase upload-config kubeadm --config /etc/kubernetes/kubeadm-cluster.yaml
  when: cfg is changed

- name: Chờ apiserver khởi động lại với cờ mới
  ansible.builtin.shell: |
    for i in $(seq 90); do
      kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw /readyz >/dev/null 2>&1 \
        && pgrep -af kube-apiserver | grep -q encryption-provider-config && exit 0
      sleep 2
    done; exit 1
  changed_when: false
  when: cfg is changed or policy is changed or enc is changed

- name: Ghi lại mọi Secret hiện có để chúng được mã hoá
  ansible.builtin.shell: |
    kubectl --kubeconfig /etc/kubernetes/admin.conf get secrets -A -o json \
      | kubectl --kubeconfig /etc/kubernetes/admin.conf replace -f - >/dev/null
  when: enc is changed

- name: Kiểm tra Secret trong etcd đã được mã hoá
  ansible.builtin.shell: |
    ETCDCTL_API=3 etcdctl --endpoints https://127.0.0.1:2379 \
      --cacert /etc/kubernetes/pki/etcd/ca.crt --cert /etc/kubernetes/pki/etcd/server.crt \
      --key /etc/kubernetes/pki/etcd/server.key \
      get /registry/secrets/cert-manager/lab-root-ca --print-value-only | head -c 26
  register: etcd_raw
  changed_when: false
  failed_when: "'k8s:enc:secretbox:v1' not in etcd_raw.stdout"
