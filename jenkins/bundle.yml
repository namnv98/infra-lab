# Tạo bundle cho chế độ offline. Chạy trên máy CÓ internet (cần Java 11+ để resolve plugin):
#   ansible-playbook bundle.yml
# Kết quả: bundle/ (JRE, jenkins.war, plugins.tar.gz, manifest.json) → mang sang máy chạy Ansible.
- name: Build offline bundle
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    bd: "{{ jenkins_bundle_dir }}"
    war_name: "jenkins-{{ jenkins_version }}.war"
    pm_jar: "{{ bd }}/jenkins-plugin-manager-{{ jenkins_plugin_manager_version }}.jar"
    plugins_stamp: "{{ jenkins_version }}\n{{ jenkins_plugins | sort | join('\n') }}"
  tasks:
    - name: Local Java is required (plugin manager)
      ansible.builtin.command: java -version
      changed_when: false

    - name: Bundle dirs
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: [ "{{ bd }}", "{{ bd }}/plugins" ]

    - name: JRE metadata (Adoptium Temurin)
      ansible.builtin.uri:
        url: "https://api.adoptium.net/v3/assets/latest/{{ jenkins_java_major }}/hotspot?architecture={{ item }}&image_type=jre&os=linux&vendor=eclipse"
      loop: "{{ jenkins_bundle_arches }}"
      register: jre_meta

    - name: Download JRE
      ansible.builtin.get_url:
        url: "{{ item.json[0].binary.package.link }}"
        dest: "{{ bd }}/{{ item.json[0].binary.package.name }}"
        checksum: "sha256:{{ item.json[0].binary.package.checksum }}"
        mode: "0644"
      loop: "{{ jre_meta.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Download jenkins.war
      ansible.builtin.get_url:
        url: "https://get.jenkins.io/war-stable/{{ jenkins_version }}/jenkins.war"
        dest: "{{ bd }}/{{ war_name }}"
        checksum: "sha256:https://get.jenkins.io/war-stable/{{ jenkins_version }}/jenkins.war.sha256"
        mode: "0644"

    - name: Download plugin manager
      ansible.builtin.get_url:
        url: "{{ jenkins_plugin_manager_url }}"
        checksum: "sha256:{{ jenkins_plugin_manager_url }}.sha256"
        dest: "{{ pm_jar }}"
        mode: "0644"

    # Danh sách plugin hoặc version Jenkins đổi → resolve lại từ đầu (tránh sót plugin cũ / sai dependency).
    # Stamp chỉ ghi SAU khi đóng gói xong → lần trước lỗi giữa chừng thì lần này vẫn resolve lại.
    - name: Plugins up to date?
      ansible.builtin.set_fact:
        plugins_fresh: "{{ (lookup('ansible.builtin.file', bd ~ '/plugins.stamp', errors='ignore') | default('', true)) == plugins_stamp and (bd ~ '/plugins.tar.gz') is file }}"

    - name: Resolve + download plugins (with dependencies)
      when: not plugins_fresh
      block:
        - name: Clean plugin dir
          ansible.builtin.file:
            path: "{{ bd }}/plugins"
            state: "{{ item }}"
            mode: "0755"
          loop: [absent, directory]

        - name: Run plugin manager
          ansible.builtin.command: >
            java -jar {{ pm_jar }}
            --war {{ bd }}/{{ war_name }}
            --plugin-download-directory {{ bd }}/plugins
            --plugins {{ jenkins_plugins | join(' ') }}
          register: pm
          changed_when: true
          retries: 3
          delay: 10
          until: pm is succeeded

        - name: Pack plugins
          ansible.builtin.command: tar -czf {{ bd }}/plugins.tar.gz -C {{ bd }}/plugins .
          changed_when: true

        - name: Plugin list stamp
          ansible.builtin.copy:
            dest: "{{ bd }}/plugins.stamp"
            content: "{{ plugins_stamp }}"
            mode: "0644"

    - name: Count plugins
      ansible.builtin.find:
        paths: "{{ bd }}/plugins"
        patterns: "*.jpi,*.hpi"
      register: plugin_files

    - name: Write manifest
      ansible.builtin.copy:
        dest: "{{ bd }}/manifest.json"
        mode: "0644"
        content: "{{ manifest | to_nice_json }}\n"
      vars:
        manifest:
          jenkins_version: "{{ jenkins_version }}"
          war: "{{ war_name }}"
          java_major: "{{ jenkins_java_major }}"
          java: "{{ dict(jre_meta.results | map(attribute='item') | zip(jre_meta.results | map(attribute='json') | map('first') | map(attribute='binary') | map(attribute='package') | map(attribute='name'))) }}"
          plugins_requested: "{{ jenkins_plugins | sort }}"
          plugins_count: "{{ plugin_files.matched }}"
          plugins_archive: plugins.tar.gz

    - name: Bundle summary
      ansible.builtin.debug:
        msg: "Bundle OK: {{ bd }} — Jenkins {{ jenkins_version }}, JRE {{ jenkins_bundle_arches | join('/') }}, {{ plugin_files.matched }} plugins"
