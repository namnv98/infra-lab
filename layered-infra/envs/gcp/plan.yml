# QUY HOẠCH MẠNG + MÁY của môi trường GCP — NGUỒN DUY NHẤT của mọi IP.
# Đổi IP / thêm máy: sửa ở đây, rồi `python3 scripts/plan.py check`, `./lab.sh plan`, chạy Ansible.
# Ai đọc file này:
#   tofu/envs/gcp/main.tf (yamldecode)   → VPC, VM, card firewall, alias IP, route
#   ansible/inventories/gcp/inventory.py → nhóm máy + ansible_host cho Ansible; biến `plan` cho group_vars
#   scripts/opnsense-bootstrap.py          → card, gateway, route của 2 firewall
#   scripts/plan.py (lab.sh, harbor-prewarm.sh) → IP jump, cấu hình VPN
# GCP giữ .0 .1 .254 .255 của mỗi subnet: gateway VPC luôn là .1, không đặt máy vào .1/.254.

platform: gcp          # gcp: VPC (.1 là gateway của GCP, firewall .253) · onprem: VLAN (firewall là gateway)
domain: lab.internal

# Vùng = VPC. gateway = gateway của VPC (.1); fw = card firewall làm "default gateway" của vùng (route VPC 0/0)
zones:
  wan:  { cidr: 10.99.0.0/24,  gateway: 10.99.0.1 }
  dmz:  { cidr: 10.10.10.0/24, gateway: 10.10.10.1, fw: 10.10.10.253 }   # biên
  lan:  { cidr: 10.20.0.0/24,  gateway: 10.20.0.1,  fw: 10.20.0.253 }    # core
  mgmt: { cidr: 10.40.0.0/24,  gateway: 10.40.0.1,  fw: 10.40.0.253 }    # core

# Route VPC ngoài 0/0 của từng vùng: vào vùng khác qua firewall khác (DMZ → LAN/MGMT đi qua core)
extra_routes:
  - { name: dmz-to-lan-core, in: dmz, to: lan,  via: firewall-core-01 }
  - { name: dmz-to-mgmt,     in: dmz, to: mgmt, via: firewall-core-01 }

# VPN quản trị (WireGuard trên firewall biên)
vpn: { cidr: 10.50.0.0/24, server: 10.50.0.1, admin: 10.50.0.2, port: 51820 }

# Kubernetes: VIP API (kube-vip) + 2 Gateway (MetalLB). GCP định tuyến các IP này bằng alias IP trên VM (xem hosts.*.alias)
k8s:
  api_vip: 10.20.0.10
  gateways:
    public:   { ip: 10.20.0.200, domain: apps.lab.internal }
    internal: { ip: 10.20.0.210, domain: int.lab.internal }
  metallb_pools:
    public:   10.20.0.200-10.20.0.209
    internal: 10.20.0.210-10.20.0.250

# 2 firewall OPNsense. nics theo thứ tự = vtnet0..n; if = tên card trong OPNsense; số card ≤ số vCPU (GCP)
firewalls:
  firewall-edge-01:
    role: edge
    type: e2-medium
    dns: 1.1.1.1                         # biên tự phân giải tên công cộng
    nics:
      - { zone: dmz, ip: 10.10.10.253, if: lan, descr: DMZ }
      - { zone: wan, ip: 10.99.0.2,    if: wan, default_gw: true }   # gắn IP public
  firewall-core-01:
    role: core
    type: e2-highcpu-4
    dns: 10.10.10.253                    # core hỏi DNS công cộng qua biên
    nics:
      - { zone: lan,  ip: 10.20.0.253,  if: lan }
      - { zone: dmz,  ip: 10.10.10.252, if: wan, descr: DMZ, default_gw: true }   # card ngoài, đi Internet qua biên
      - { zone: mgmt, ip: 10.40.0.253,  if: opt1, descr: MGMT }

# VM Linux. groups = vai trò (nhóm Ansible); alias = tên trong k8s.* để GCP định tuyến IP phụ tới VM
hosts:
  k8s-master-01: { groups: [k8s_control_plane], zone: lan,  ip: 10.20.0.11,  type: e2-medium, disk: 30, alias: [api_vip] }
  k8s-worker-01: { groups: [k8s_workers],       zone: lan,  ip: 10.20.0.21,  type: e2-medium, disk: 30, alias: [gateway_public, gateway_internal] }
  infra-01:      { groups: [infra],             zone: lan,  ip: 10.20.0.30,  type: e2-medium, disk: 50 }
  edge-01:       { groups: [edge],              zone: dmz,  ip: 10.10.10.10, type: e2-small,  disk: 10 }
  siem-01:       { groups: [siem],              zone: mgmt, ip: 10.40.0.10,  type: e2-medium, disk: 30 }
  jump-01:       { groups: [bastion],           zone: mgmt, ip: 10.40.0.20,  type: e2-micro,  disk: 10 }
