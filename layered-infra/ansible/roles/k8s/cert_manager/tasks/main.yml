- name: Cài cert-manager {{ cert_manager_version }} (bật hỗ trợ Gateway API)
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: cert-manager
    chart_repo_url: https://charts.jetstack.io
    chart_version: "{{ cert_manager_version }}"
    release_namespace: cert-manager
    create_namespace: true
    wait: true
    values:
      crds: { enabled: true }
      config:
        apiVersion: controller.config.cert-manager.io/v1alpha1
        kind: ControllerConfiguration
        gatewayAPI: { enabled: true }   # tự cấp cert cho listener HTTPS của Gateway
      resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
      webhook: { resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } } }
      cainjector: { resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } } }
      startupapicheck: { resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } } }

- name: CA riêng của lab (self-signed root → ClusterIssuer lab-ca)
  kubernetes.core.k8s:
    template: lab-ca.yaml.j2
    wait: true
    wait_condition: { type: Ready, status: "True" }

- name: Đọc cert CA
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: cert-manager
    name: lab-root-ca
  register: ca_secret

- name: Lưu CA về host ({{ lab_ca_local }})
  ansible.builtin.copy:
    content: "{{ ca_secret.resources[0].data['ca.crt'] | b64decode }}"
    dest: "{{ lab_ca_local }}"
    mode: "0644"
  delegate_to: localhost
  become: false
