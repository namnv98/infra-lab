# siem-01: Loki + Alloy + Grafana (SIEM nhẹ, ~600MB RAM). Image qua Harbor, gói qua Squid.
- name: Tin CA của lab (Harbor dùng cert do lab-ca ký)
  ansible.builtin.copy:
    src: "{{ lab_ca_local }}"
    dest: /usr/local/share/ca-certificates/lab-ca.crt
    mode: "0644"
  register: ca

- name: Cập nhật kho CA
  ansible.builtin.command: update-ca-certificates
  when: ca is changed

- name: apt đi qua Squid
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/90proxy
    content: |
      Acquire::http::Proxy "{{ proxy_url }}";
      Acquire::https::Proxy "{{ proxy_url }}";
    mode: "0644"

# NTP của siem-01: role node_network của team network (chrony → OPNsense card MGMT), network/10-firewall.yml

- name: Cài Docker + compose
  ansible.builtin.apt:
    name: [docker.io, docker-compose-v2]
    update_cache: true
    cache_valid_time: 3600
  register: docker_pkg

- name: Docker đọc lại kho CA (để kéo image từ Harbor)
  ansible.builtin.systemd_service: { name: docker, state: restarted }
  when: ca is changed and not docker_pkg is changed

- name: Thư mục
  ansible.builtin.file:
    path: "{{ item.p }}"
    state: directory
    owner: "{{ item.o | default('root') }}"
    mode: "0755"
  loop:
    - { p: /opt/mon }
    - { p: /opt/mon/data/loki, o: "10001" }
    - { p: /opt/mon/data/alloy }
    - { p: /opt/mon/data/grafana, o: "472" }
    - { p: /opt/mon/data/mailpit, o: "1000" }
    - { p: /opt/mon/grafana/provisioning/datasources }
    - { p: /opt/mon/grafana/provisioning/dashboards }
    - { p: /opt/mon/grafana/provisioning/alerting }
    - { p: /opt/mon/grafana/dashboards }

- name: Mật khẩu admin Grafana
  ansible.builtin.copy:
    dest: /opt/mon/grafana-admin.txt
    content: "{{ lookup('ansible.builtin.password', grafana_admin_password_file, chars=['ascii_letters', 'digits'], length=20) }}"
    owner: "472"
    mode: "0400"
  no_log: true

- name: Cấu hình
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/opt/mon/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: docker-compose.yml.j2, dest: docker-compose.yml }
    - { src: loki.yaml.j2, dest: loki.yaml }
    - { src: config.alloy.j2, dest: config.alloy }
    - { src: datasource.yaml.j2, dest: grafana/provisioning/datasources/loki.yaml }
    - { src: alerts.yaml.j2, dest: grafana/provisioning/alerting/lab-security.yaml }
    - { src: notify.yaml.j2, dest: grafana/provisioning/alerting/notify.yaml }
    - { src: alerts-metrics.yaml.j2, dest: grafana/provisioning/alerting/lab-metrics.yaml }
    - { src: dashboard.json.j2, dest: grafana/dashboards/lab-security.json }
  register: cfg

- name: Dashboard số liệu (Node Exporter Full, Kubernetes) — tải từ grafana.com, datasource = prometheus
  ansible.builtin.copy:
    src: dashboards/
    dest: /opt/mon/grafana/dashboards/
    mode: "0644"
  register: dash

- name: Grafana tự nạp dashboard trong thư mục
  ansible.builtin.copy:
    dest: /opt/mon/grafana/provisioning/dashboards/lab.yaml
    content: |
      apiVersion: 1
      providers:
        - name: lab
          folder: SIEM
          type: file
          options: { path: /var/lib/grafana/dashboards }
    mode: "0644"

- name: Kéo image qua Harbor (thử lại khi mạng chập chờn)
  ansible.builtin.command: docker compose pull --quiet
  args: { chdir: /opt/mon }
  register: pull
  until: pull.rc == 0
  retries: 5
  delay: 15
  changed_when: false

- name: Chạy (tạo lại container khi cấu hình đổi)
  ansible.builtin.command: "docker compose up -d {{ '--force-recreate' if cfg is changed else '' }}"
  args: { chdir: /opt/mon }
  register: up
  changed_when: "'Started' in up.stderr or 'Recreated' in up.stderr or 'Created' in up.stderr"

- name: Chờ Loki và Grafana sẵn sàng
  ansible.builtin.uri:
    url: "{{ item }}"
  loop: ["http://127.0.0.1:3000/api/health"]
  register: h
  until: h.status == 200
  retries: 30
  delay: 4

# Vulnerability detection của Wazuh cần indexer (không chạy ở đây) và tải feed từ cti.wazuh.com mỗi giờ
# → vô dụng và bị firewall chặn liên tục. Tắt đi.
- name: Wazuh có đang bật vulnerability-detection không
  ansible.builtin.command: docker exec mon-wazuh-manager-1 sh -c "sed -n '/<vulnerability-detection>/,/<\/vulnerability-detection>/p' /var/ossec/etc/ossec.conf | grep -c '<enabled>yes'"
  register: vd
  changed_when: false
  failed_when: false

- name: Tắt vulnerability-detection
  ansible.builtin.command: docker exec mon-wazuh-manager-1 sed -i "/<vulnerability-detection>/,/<\/vulnerability-detection>/s#<enabled>yes</enabled>#<enabled>no</enabled>#" /var/ossec/etc/ossec.conf
  when: vd.stdout | default('0') | int > 0
  register: vd_off

- name: Khởi động lại Wazuh manager
  ansible.builtin.command: docker restart mon-wazuh-manager-1
  when: vd_off is changed
