# firewall-edge-01 on-prem: firewall BIÊN. Card (hosts.yml): wan (IP nhà mạng), lan = TRANSIT (↔ core), opt1 = DMZ, wireguard.
# Khác GCP (ansible/network/host_vars/firewall-edge-01.yml):
#   - DMZ là opt1; lan là transit → luật "từ trong ra" (LAN/MGMT/core đi Internet) nằm trên lan, luật của DMZ nằm trên opt1.
#   - Không có VPC route: DMZ vào trong (Gateway public, siem-01) ĐI QUA biên rồi mới tới core → biên cũng lọc (#13-15).
#   - VPN dùng thẳng IP WAN (không có IP VPN riêng/protocol forwarding của GCP).
opn_role: edge
opnsense_url: "https://{{ zones.dmz.fw }}"   # qua VPN (00-firewall-bootstrap.yml thay bằng IP public lúc dựng)
opnsense_api_file: "{{ lab_out }}/opnsense-edge-api.txt"

# Lúc bootstrap (00-firewall-bootstrap.yml qua WAN): chỉ dựng VPN + các luật VPN
opn_bootstrap_rules: ["Internet → WireGuard", "VPN admin → jump server (SSH)", "VPN admin → ping jump server",
                      "VPN admin → DNS nội bộ (core)", "VPN admin → GUI/API firewall core", "VPN admin → GUI/API firewall biên"]

opn_rules:
  # --- WAN ---
  - { sequence: "5",   interface: wan, action: pass, protocol: UDP, source_net: any, destination_net: wanip, destination_port: "{{ wg_port }}", description: "Internet → WireGuard" }
  # --- VPN quản trị: chỉ tới jump-01 và GUI/API 2 firewall; mọi máy khác đi qua jump-01 ---
  - { sequence: "300", interface: wireguard, action: pass,  protocol: TCP,     source_net: admin_hosts, destination_net: jump_host,   destination_port: "22",  description: "VPN admin → jump server (SSH)" }
  - { sequence: "301", interface: wireguard, action: pass,  protocol: ICMP,    source_net: admin_hosts, destination_net: jump_host,                           description: "VPN admin → ping jump server" }
  - { sequence: "302", interface: wireguard, action: pass,  protocol: TCP/UDP, source_net: admin_hosts, destination_net: fw_core_lan, destination_port: "53",  description: "VPN admin → DNS nội bộ (core)" }
  - { sequence: "303", interface: wireguard, action: pass,  protocol: TCP,     source_net: admin_hosts, destination_net: fw_core_lan, destination_port: "443", description: "VPN admin → GUI/API firewall core" }
  - { sequence: "304", interface: wireguard, action: pass,  protocol: TCP,     source_net: admin_hosts, destination_net: fw_edge_dmz, destination_port: "443", description: "VPN admin → GUI/API firewall biên" }
  - { sequence: "309", interface: wireguard, action: block, protocol: any,     source_net: any,         destination_net: any, log: "1",                        description: "VPN → còn lại: CHẶN (ghi log)" }
  # --- DMZ (opt1): edge-01 ra Internet, DNS/NTP của biên, vào trong đúng các đích sau (core lọc lần nữa) ---
  - { sequence: "10", interface: opt1, action: pass,  protocol: TCP,     source_net: haproxy_dmz, destination_net: RFC1918, destination_not: "1", destination_port: web_ports, description: "edge-01 → Internet 80/443 (apt, Docker Hub)" }
  - { sequence: "11", interface: opt1, action: pass,  protocol: TCP/UDP, source_net: haproxy_dmz, destination_net: opt1ip, destination_port: "53",  description: "DMZ → DNS của firewall biên" }
  - { sequence: "12", interface: opt1, action: pass,  protocol: UDP,     source_net: haproxy_dmz, destination_net: opt1ip, destination_port: "123", description: "DMZ → NTP của firewall biên" }
  - { sequence: "13", interface: opt1, action: pass,  protocol: TCP,     source_net: haproxy_dmz, destination_net: gw_public, destination_port: web_ports,    description: "edge-01 → Gateway public (80,443)" }
  - { sequence: "14", interface: opt1, action: pass,  protocol: TCP/UDP, source_net: haproxy_dmz, destination_net: mon_host,  destination_port: syslog_ports, description: "edge-01 → siem-01 syslog" }
  - { sequence: "15", interface: opt1, action: pass,  protocol: TCP,     source_net: haproxy_dmz, destination_net: mon_host,  destination_port: wazuh_ports,  description: "edge-01 → Wazuh manager" }
  - { sequence: "39", interface: opt1, action: block, protocol: any,     source_net: any,         destination_net: any, log: "1",                         description: "DMZ → còn lại: CHẶN (ghi log)" }
  # --- TRANSIT (lan): từ trong (qua core, core không NAT) ra Internet / vào DMZ ---
  - { sequence: "20", interface: lan, action: pass,  protocol: TCP,     source_net: svc_hosts,   destination_net: RFC1918, destination_not: "1", destination_port: web_ports, description: "infra-01 → Internet 80/443 (đã qua core)" }
  - { sequence: "19", interface: lan, action: pass,  protocol: TCP,     source_net: "{{ zones.lan.cidr }}", destination_net: RFC1918, destination_not: "1", destination_port: web_ports, description: "TẠM: LAN (qua core) → Internet 80/443", enabled: "{{ '1' if egress_temp_open else '0' }}" }
  - { sequence: "21", interface: lan, action: pass,  protocol: TCP,     source_net: fw_core_dmz, destination_net: RFC1918, destination_not: "1", destination_port: web_ports, description: "firewall core → Internet 80/443 (cập nhật)" }
  - { sequence: "22", interface: lan, action: pass,  protocol: TCP/UDP, source_net: fw_core_dmz, destination_net: RFC1918, destination_not: "1", destination_port: "53",  description: "firewall core → DNS Internet (Unbound đệ quy)" }
  - { sequence: "23", interface: lan, action: pass,  protocol: UDP,     source_net: fw_core_dmz, destination_net: RFC1918, destination_not: "1", destination_port: "123", description: "firewall core → NTP Internet" }
  - { sequence: "24", interface: lan, action: pass,  protocol: TCP/UDP, source_net: fw_core_dmz, destination_net: lanip, destination_port: "53",  description: "firewall core → DNS của firewall biên" }
  - { sequence: "30", interface: lan, action: pass,  protocol: TCP,     source_net: jump_host,   destination_net: fw_edge_dmz, destination_port: admin_ports, description: "jump-01 → quản trị firewall biên" }
  - { sequence: "31", interface: lan, action: pass,  protocol: TCP,     source_net: jump_host,   destination_net: opt1, destination_port: jump_admin_ports, description: "jump-01 → máy trong DMZ (quản trị)" }
  - { sequence: "32", interface: lan, action: pass,  protocol: ICMP,    source_net: jump_host,   destination_net: opt1,                                   description: "jump-01 → ping DMZ" }
  - { sequence: "33", interface: lan, action: pass,  protocol: TCP,     source_net: "{{ zones.lan.cidr }}", destination_net: opt1, destination_port: admin_ports, description: "LAN → DMZ quản trị (22,80,443)" }
  - { sequence: "49", interface: lan, action: block, protocol: any,     source_net: any,         destination_net: any, log: "1",                                description: "TRANSIT → còn lại: CHẶN (ghi log)" }

# Luật mặc định của hãng: "allow LAN to any" (ở đây LAN = transit) → tắt, thay bằng luật trên
opn_disabled_rules: ["Default allow LAN to any rule", "Default allow LAN IPv6 to any rule"]

# Source NAT (hybrid): NAT tự động chỉ gồm mạng nối trực tiếp (transit, DMZ); LAN/MGMT tới qua core (route tĩnh, core không NAT)
opn_snat_rules:
  - { source_net: "{{ zones.lan.cidr }}", description: "NAT: LAN (qua core) → Internet" }
  - { source_net: "{{ zones.mgmt.cidr }}", description: "NAT: MGMT (qua core) → Internet" }
