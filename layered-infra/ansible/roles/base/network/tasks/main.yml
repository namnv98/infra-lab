- name: Tắt cấu hình mạng của cloud-init (để nó không ghi đè netplan khi boot)
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    content: "network: {config: disabled}\n"
    mode: "0644"

- name: "Netplan: DNS là OPNsense (route do VPC trỏ vào OPNsense)"
  ansible.builtin.template:
    src: netplan.yaml.j2
    dest: /etc/netplan/50-cloud-init.yaml
    mode: "0600"
  register: np

- name: Bỏ route DMZ riêng cũ (default route qua OPNsense đã bao gồm)
  ansible.builtin.file:
    path: /etc/netplan/60-dmz-route.yaml
    state: absent
  register: np_old

- name: Áp dụng netplan
  ansible.builtin.command: netplan apply
  when: np is changed or np_old is changed

# Ubuntu image của GCP đồng bộ giờ bằng chrony (lab local: systemd-timesyncd)
- name: NTP lấy từ OPNsense (chrony), bỏ NTP metadata của Google
  ansible.builtin.copy:
    dest: /etc/chrony/chrony.conf
    content: |
      # Do Ansible quản lý (role base/network): giờ lấy từ OPNsense trong vùng, như on-prem
      server {{ zone_fw }} iburst prefer
      keyfile /etc/chrony/chrony.keys
      driftfile /var/lib/chrony/chrony.drift
      logdir /var/log/chrony
      maxupdateskew 100.0
      rtcsync
      makestep 1 3
    mode: "0644"
  notify: Restart chrony

- name: Ghi nhận để khởi động lại CoreDNS (nó đọc DNS upstream lúc khởi động)
  ansible.builtin.set_fact:
    dns_changed: "{{ np is changed }}"
