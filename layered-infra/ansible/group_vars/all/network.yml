# Biến mạng dùng trong role — MỌI giá trị lấy từ plan.yml (nguồn IP duy nhất), file này chỉ đặt tên cho dễ dùng
lab_domain: "{{ plan.domain }}"

# Firewall: core trên LAN (DNS nội bộ, GUI/API core) — firewall của từng vùng (zone_fw): group_vars/zone_*.yml
lan_fw: "{{ plan.zones.lan.fw }}"

# Máy có vai trò dịch vụ (luật, DNS, proxy trỏ tới) — theo nhóm, không theo tên máy
svc_ip: "{{ plan.hosts[groups['infra'][0]].ip }}"       # infra-01: Harbor + Squid + S3
mon_ip: "{{ plan.hosts[groups['siem'][0]].ip }}"        # siem-01
jump_ip: "{{ plan.hosts[groups['bastion'][0]].ip }}"     # jump-01

# Kubernetes: VIP API + 2 Gateway + dải MetalLB
api_vip: "{{ plan.k8s.api_vip }}"
api_endpoint: "{{ api_vip }}"
metallb_pools: "{{ plan.k8s.metallb_pools }}"
gateways: "{{ plan.k8s.gateways }}"

# VPN quản trị (WireGuard trên firewall biên)
wg_port: "{{ plan.vpn.port }}"
wg_server_address: "{{ plan.vpn.server }}/{{ plan.vpn.cidr.split('/')[1] }}"
wg_admin_address: "{{ plan.vpn.admin }}/32"

# Proxy đi ra (Squid trên infra-01). no_proxy: VIP + mọi node K8s + mạng nội bộ
proxy_url: "http://proxy.{{ lab_domain }}:3128"
proxy_no: "localhost,127.0.0.1,{{ ([api_vip] + groups['k8s'] | map('extract', plan.hosts) | map(attribute='ip')) | join(',') }},10.0.0.0/8,.svc,.cluster.local,.{{ lab_domain }}"
