# Nạp cache Harbor bằng mọi image cluster đang dùng (scripts/harbor-prewarm.sh) — trước khi khoá egress, sau mỗi lần thêm app.
- name: Nạp cache Harbor
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Kéo trước qua Harbor mọi image đang chạy
      ansible.builtin.command: "{{ lab_root | default(playbook_dir ~ '/../..') }}/scripts/harbor-prewarm.sh"
      changed_when: false
