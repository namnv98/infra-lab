# App (whoami) + cert vùng biên. Sau 40 vì image kéo qua Harbor.
#   Cert vùng biên ghi ra edge_tls_file trên máy admin → network cài lên HAProxy edge-01 (network/20-edge.yml).
- name: App demo + cert cho vùng biên
  hosts: "{{ groups['k8s_control_plane'][0] }}"
  become: true
  environment: "{{ egress_env | combine({'K8S_AUTH_KUBECONFIG': '/etc/kubernetes/admin.conf', 'KUBECONFIG': '/etc/kubernetes/admin.conf'}) }}"
  roles:
    - apps/whoami        # app whoami để kiểm tra
  tasks:
    - name: Cert vùng biên *.{{ gateways.public.domain }} (ký bởi lab-ca, key riêng, không dùng chung với Gateway)
      kubernetes.core.k8s:
        wait: true
        wait_condition: { type: Ready, status: "True" }
        definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata: { name: edge-tls, namespace: cert-manager }
          spec:
            secretName: edge-tls
            dnsNames: ["*.{{ gateways.public.domain }}", "{{ gateways.public.domain }}"]
            duration: 8760h
            issuerRef: { name: lab-ca, kind: ClusterIssuer }

    - name: Đọc cert vùng biên
      kubernetes.core.k8s_info: { kind: Secret, namespace: cert-manager, name: edge-tls }
      register: edge_secret
      no_log: true

    - name: Giao cert vùng biên cho network (cert + key, 1 file PEM trên máy admin)
      ansible.builtin.copy:
        dest: "{{ edge_tls_file }}"
        content: "{{ edge_secret.resources[0].data['tls.crt'] | b64decode }}{{ edge_secret.resources[0].data['tls.key'] | b64decode }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
