# Kho S3 nội bộ cho backup (Velero). Garage: nhẹ, tương thích S3, tự host được.
# (MinIO bản cộng đồng đã ngừng phát hành image/binary từ cuối 2025 nên không dùng.)
garage_image: dxflrs/garage:v2.4.1
garage_dir: /opt/garage
garage_s3_port: 3900                # chỉ LAN dùng (LAN→infra-01 cùng subnet, không qua OPNsense)
garage_capacity: 20G                # dung lượng dành cho dữ liệu trên đĩa infra-01
garage_region: garage
garage_bucket: velero
garage_key_name: velero
garage_allowed_src: "{{ plan.zones.lan.cidr }}"   # chỉ node/pod trong LAN được gọi S3 (DOCKER-USER)
# Key/secret: group_vars/all/secrets.yml (dùng chung với Velero)
garage_key_id: "{{ s3_velero_key_id }}"
garage_secret: "{{ s3_velero_secret }}"
